async function spinWheel(){
  const W = wheelState(); if (!W.ready || wheelBusy) return;
  wheelBusy = true;   // keeps the modal from re-rendering mid-spin
  const i = rnd(WHEEL.length), s = WHEEL[i], mult = streakMult(W.streak);
  let prize = '', itemKey = null, txt = '';
  if (s.k==='I'){
    const pool = [...SHOP.av.map(([e,p]) => ['av:'+e, p, avText(e)]), ...SHOP.felt.map(x => ['felt:'+x[0], x[2], x[1]+' (Filz)']), ...SHOP.back.map(x => ['back:'+x[0], x[2], x[1]+' (Kartenrücken)'])]

    if (pool.length){ const it = pick(pool); itemKey = it[0]; txt = `🎁 ${it[2]} gewonnen!`; }

  let addL = 0, addE = 0;
  if (s.k==='L' || s.k==='J') addL = Math.round(s.v * mult);
  if (s.k==='E') addE = Math.round(s.v * mult);
  if (s.k==='I' && !itemKey) addE = 2500;
  if (!txt) txt = addL ? `+${fmt(addL)} Legats` : `+${fmt(addE)} €`;

const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

function rWins(key, n){
  if (key[0]==='n') return +key.slice(1)===n ? 36 : 0;
  if (n===0) return 0;
  switch (key){
    case 'red': return RED.has(n) ? 2 : 0;   case 'black': return !RED.has(n) ? 2 : 0;
    case 'odd': return n%2 ? 2 : 0;           case 'even': return n%2 ? 0 : 2;
    case 'low': return n<=18 ? 2 : 0;         case 'high': return n>=19 ? 2 : 0;
    case 'd1': return n<=12 ? 3 : 0;          case 'd2': return n>=13 && n<=24 ? 3 : 0;   case 'd3': return n>=25 ? 3 : 0;
    case 'c1': return n%3===1 ? 3 : 0;        case 'c2': return n%3===2 ? 3 : 0;          case 'c3': return n%3===0 ? 3 : 0;
  }
  return 0;
}

async function rSpin(){
  if (R.busy) return; const total = rTotal(R.bets);

  const n = rnd(37);

  R.last = { ...R.bets }; R.busy = true; R.res = null; renderRoulette(true);

const taskCache = {};
function todayTasks(day = dayId()){
  const key = uid + '|' + day; if (taskCache[key]) return taskCache[key];

}
function taskBump(d, k, n){

  if (!todayTasks(day).some(t => t.k === k)) return;

/* ---------- Crash: eine Rakete für alle ---------- */
const CR_BET = 8000, CR_PAUSE = 3500, CR_RATE = 0.00012, CR_CAP = 200, CR_MAXFLY = Math.ceil(Math.log(CR_CAP) / CR_RATE);

/** the rounds run on the clock, so phones whose clocks are off get corrected with the web server's time */
async function syncClock(){
  try {
    const t0 = Date.now(), r = await fetch(location.href.split('#')[0], { method: 'HEAD', cache: 'no-store' }), t1 = Date.now();
    const d = Date.parse(r.headers.get('date') || ''); if (!d) return;
    const off = d + 500 - (t0 + t1) / 2; if (Math.abs(off) > 1500) clockOff = off;

}
const NOW = () => Date.now() + clockOff;
/** all rounds of one hour. Every crash point is fixed in advance and the same for everyone */
function crashHour(h){
  if (CR.hours[h]) return CR.hours[h];
  const out = [], start = h * 3600e3, end = start + 3600e3;
  for (let t = start, i = 0; t + CR_BET + CR_MAXFLY + CR_PAUSE <= end; i++){
    const u = seeded('crash-' + h + '-' + i)();
    const cp = Math.min(CR_CAP, Math.max(1, Math.floor(97 / (1 - u)) / 100));   // P(≥ x) = 0,97 / x
    const fly = Math.round(Math.log(cp) / CR_RATE);
    out.push({ id: h + '-' + i, start: t, fly: t + CR_BET, boom: t + CR_BET + fly, end: t + CR_BET + fly + CR_PAUSE, cp });

}

  return { phase, r, t, m: phase === 'fly' ? crMult(r, t) : phase === 'boom' ? r.cp : 1 };
}
function crashHistory(n){ const t = NOW(), h = Math.floor(t / 3600e3); return [...crashHour(h - 1), ...crashHour(h)].filter(r => r.boom <= t).slice(-n).reverse(); }
function crashBet(){

async function duelAnswer(id, yes){
  const ref = doc(fs, 'duels', id);
  try {
    const du = await runTransaction(fs, async tx => {
      const s = await tx.get(ref); const x = s.data(); if (!x || x.st !== 'open' || x.b !== uid) return null;

/* ---------- Tellerwäscher-Schicht: the way back after going broke ---------- */
const DISH_MS = 30000, DISH_PAY = 50, DISH_GOLD = 150, DISH_ROACH = -200, DISH_MIN = 300, DISH_MAX = 2500;
const REVIVE_WAIT = [0, 5, 10, 15, 20];          // minutes, by revives in the last 7 days
const DISH = { phase:'intro', n:0, gold:0, roach:0, end:0, timer:null, collected:false };
const recentRevives = (d=P) => (d?.revives || []).filter(t => Date.now() - t < 7*864e5).length;
const reviveWaitMin = (d=P) => REVIVE_WAIT[Math.min(recentRevives(d), REVIVE_WAIT.length - 1)];
const reviveAt = (d=P) => (d?.brokeAt || 0) + reviveWaitMin(d) * 60e3;
const dishEarn = () => Math.max(DISH_MIN, Math.min(DISH_MAX, DISH.n*DISH_PAY + DISH.gold*DISH_GOLD + DISH.roach*DISH_ROACH));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function reviveBox(){
  const wait = reviveAt() - Date.now(), mins = reviveWaitMin();
  return `<div class="note bad stack"><p><b>Du bist pleite.</b> Legats und Bankkonto sind leer. Verdien dir deinen Neustart mit einer <b>Schicht als Tellerwäscher</b>: 30 Sekunden Teller spülen, jeder Teller bringt ${DISH_PAY} €. Der Lohn (${fmt(DISH_MIN)} bis ${fmt(DISH_MAX)} €) kommt auf dein Bankkonto. Das zählt als Pleite in deiner Statistik.</p>
  ${wait > 0 ? `<p>Die Küche öffnet in <b class="num" data-mmss="${reviveAt()}">${mmss(wait)}</b>. <span class="muted small">Wartezeit ${mins} Minuten, weil du in den letzten 7 Tagen schon ${recentRevives()}× pleite warst.</span></p>`
    : `<div><button class="btn gold" data-act="revive">🧽 Schicht antreten</button></div>`}
  ${mins === 0 && recentRevives() === 0 ? '<p class="muted small">Die erste Pleite in 7 Tagen geht sofort. Danach wartest du 5, 10, 15 und höchstens 20 Minuten.</p>' : ''}</div>`;

function dishHTML(){
  const head = `<div class="row" style="justify-content:space-between"><h2>Tellerwäscher-Schicht</h2>${DISH.phase==='run' ? '' : '<button class="btn sm" data-act="closemodal">Schließen</button>'}</div>`;

      ${earn === DISH_MAX ? '<p class="muted small">Höchstlohn erreicht!</p>' : ''}</div>

        <button class="btn gold" data-act="dishstart">Los geht's</button>

function dishHud(){
  const t = $('dishtime'), n = $('dishn'), p = $('dishpay'), bar = $('dishbar');
  const left = Math.max(0, DISH.end - Date.now());
  if (t) t.textContent = Math.ceil(left/1000);
  if (n) n.textContent = DISH.n + DISH.gold;
  if (p) p.textContent = fmt(Math.max(0, DISH.n*DISH_PAY + DISH.gold*DISH_GOLD + DISH.roach*DISH_ROACH));
  if (bar) bar.style.width = (left / DISH_MS * 100).toFixed(1) + '%';
}
function dishStart(){
  if (DISH.phase !== 'intro') return;
  if (!isBroke()) { closeModal(); return; }
  if (Date.now() < reviveAt()) return toast('Die Küche hat noch zu.');
  // the shift is written down first: a reload during the shift ends it with the minimum wage
  if (!withPlayer(d => { if (!brokeDoc(d) || d.shift) return false; d.shift = { at: Date.now() }; return true; })) return;
  Object.assign(DISH, { phase:'run', n:0, gold:0, roach:0, end: Date.now() + DISH_MS, collected:false });
  $('sinkintro')?.remove();
  document.querySelector('#modal-card [data-act="closemodal"]')?.remove();
  const sink = $('sink');
  sink.addEventListener('pointerdown', e => {
    const pl = e.target.closest('.plate'); if (!pl || pl.dataset.hit || DISH.phase !== 'run') return;
    e.preventDefault(); pl.dataset.hit = '1';
    const k = pl.dataset.k;
    if (k === 'gold'){ DISH.gold++; SFX.coins(); }
    else if (k === 'roach'){ DISH.roach++; tone(160, .18, { type:'sawtooth', vol:.05, to:90 }); }
    else { DISH.n++; noise(.06, { vol:.18, freq:2400, q:.7 }); tone(1300, .05, { vol:.04, to:1900 }); }
    pl.classList.add(k === 'roach' ? 'squash' : 'clean');
    const pop = document.createElement('span'); pop.className = 'dishpop' + (k === 'roach' ? ' bad' : '');
    pop.textContent = k === 'gold' ? `+${DISH_GOLD}` : k === 'roach' ? `${DISH_ROACH}` : `+${DISH_PAY}`;
    pop.style.left = pl.style.left; pop.style.top = pl.style.top; sink.appendChild(pop);
    setTimeout(() => { pl.remove(); pop.remove(); }, 450);
    dishHud();
  });
  const spawn = () => {
    if (DISH.phase !== 'run') return;
    const f = 1 - Math.max(0, DISH.end - Date.now()) / DISH_MS;   // 0 → 1 over the shift
    const r = Math.random(), k = r < 0.08 ? 'gold' : r < 0.22 ? 'roach' : 'plate';
    const pl = document.createElement('button');
    pl.type = 'button'; pl.className = 'plate ' + (k === 'gold' ? 'pl gold' : k === 'roach' ? 'roach' : 'pl'); pl.dataset.k = k;
    if (k === 'roach') pl.textContent = '🪳'; pl.setAttribute('aria-label', k === 'roach' ? 'Kakerlake' : 'Teller');
    pl.style.left = (10 + Math.random()*80).toFixed(1) + '%'; pl.style.top = (14 + Math.random()*72).toFixed(1) + '%';
    const life = (k === 'gold' ? 900 : 1700) - 700*f;
    pl.style.setProperty('--life', life + 'ms');
    sink.appendChild(pl);
    setTimeout(() => { if (!pl.dataset.hit) pl.remove(); }, life);
    DISH.timer = setTimeout(spawn, 560 - 280*f + Math.random()*120);
  };
  spawn();
  const tick = setInterval(() => {
    dishHud();
    if (Date.now() >= DISH.end){ clearInterval(tick); clearTimeout(DISH.timer); DISH.phase = 'done'; SFX.win(); renderModal(true); }
  }, 100);
}
function finishRevive(earn, plates=0){
  const now = Date.now();
  return withPlayer(d => { WHY = 'Tellerwäscher-Schicht';
    if (!brokeDoc(d)) { if (d.shift){ d.shift = null; return true; } return false; }
    d.euro += earn; d.stats.bankrupts += 1; d.limits = { ...(d.limits||{}), base: d.balance }; d.ledger = null; d.lowMark = d.balance + d.euro;
    d.streaks = { win:0, bj:0 }; d.shift = null;
    d.revives = [...(d.revives||[]).filter(t => now - t < 7*864e5), now].slice(-10);
    grant(d,'broke1'); if (d.stats.bankrupts >= 5) grant(d,'broke5');
    if (plates >= 40) grant(d,'dish40');
    return true;
  });
}
function dishCollect(){

}

const avText = a => a && String(a).startsWith('img:') ? (IMG_NAME[a] || '') : (a || '🙂');

/* ---------- Kontobuch: every change of Legats or Euro, with a reason ---------- */
/** true when a player's balance doesn't match their own account book */
function suspicious(p){
  const L = p?.log; if (!L || L.length < 1) return false;
  const last = L[L.length - 1];
  if (last.B !== p.balance || last.E !== (p.euro ?? START_EURO)) return true;
  for (let i = 1; i < L.length; i++){
    if (L[i-1].B + L[i].b !== L[i].B || L[i-1].E + L[i].e !== L[i].E) return true;
    if (L[i].r === '?' && (L[i].b > 0 || L[i].e > 0)) return true;
  }
  return false;
}
function logHTML(p, n = 15){
  const L = (p.log || []).slice(-n).reverse().filter(x => x.r !== 'start');
  if (!L.length) return '<p class="muted small">Noch keine Einträge.</p>';
  return `<div class="hist">${L.map(x => `<div class="h"><span class="muted num">${new Date(x.t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span>${esc(x.r)}</span><b class="num">${x.b ? `<span style="color:${x.b>0?'var(--win)':'var(--lose)'}">${sgn(x.b)} ℒ</span>` : ''}${x.b && x.e ? ' ' : ''}${x.e ? `<span style="color:${x.e>0?'var(--win)':'var(--lose)'}">${sgn(x.e)} €</span>` : ''}</b></div>`).join('')}</div>`;
}

/* ---------- Höher oder Tiefer ---------- */
const HL = { stake: ls.get('hilostake', 500), run: null, id: 0, msg: '' };
const HL_EDGE = 0.97, HL_MAX = 100;
const hlP = (r, dir) => dir === 'hi' ? (14 - r) / 12 : (r - 2) / 12;          // ties don't count: 12 other ranks
const hlFactor = (r, dir) => { const p = hlP(r, dir); return p <= 0 ? 0 : Math.max(1.01, Math.floor(HL_EDGE / p * 100) / 100); };
const hlCard = () => ({ r: 2 + rnd(13), s: 'SHDC'[rnd(4)] });
const hlCode = c => '23456789TJQKA'[c.r - 2] + c.s;
const multFmt = m => '×' + m.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function hlStart(){
  if (HL.run && !HL.run.over) return;
  const err = betError(HL.stake); if (err) return toast(err);
  const stake = HL.stake;
  if (!withPlayer(d => { if (d.balance < stake) return false; d.balance -= stake; d.hilo = { stake, at: Date.now() }; return true; }, 'Höher oder Tiefer Einsatz')) return;
  ls.set('hilostake', stake);
  HL.id++; HL.run = { stake, cards: [hlCard()], mult: 1, n: 0, over: false }; HL.msg = ''; SFX.chip(); renderAll();
}
function hlGuess(dir){
  const R_ = HL.run; if (!R_ || R_.over) return;
  const cur = R_.cards[R_.cards.length - 1], f = hlFactor(cur.r, dir); if (!f) return;
  const next = hlCard(); R_.cards.push(next);
  if (next.r === cur.r){ HL.msg = 'Gleich! Kein Verlust, rate nochmal.'; renderAll(); return; }
  if ((dir === 'hi') === (next.r > cur.r)){
    R_.mult = Math.round(R_.mult * f * 100) / 100; R_.n++; HL.msg = '';
    if (R_.mult >= HL_MAX || R_.n >= 25){ renderAll(); setTimeout(hlCash, 700); return; }
    setTimeout(() => SFX.push(), 450);
  } else {
    R_.over = true; R_.lost = true; HL.msg = `Leider ${dir === 'hi' ? 'tiefer' : 'höher'}. ${fmt(R_.stake)} ℒ verloren.`;
    withPlayer(d => { record(d, 'hilo', R_.stake, 0); d.hilo = null; return true; }, 'Höher oder Tiefer');
    setTimeout(() => SFX.lose(), 450);
  }
  renderAll();
}
function hlCash(){
  const R_ = HL.run; if (!R_ || R_.over || R_.n < 1) return;
  R_.over = true; const pay = Math.floor(R_.stake * R_.mult);
  withPlayer(d => { d.balance += pay; record(d, 'hilo', R_.stake, pay); d.hilo = null; if (R_.n >= 10) grant(d, 'hilo10'); return true; }, 'Höher oder Tiefer');
  HL.msg = `Ausgezahlt: ${fmt(pay)} ℒ (${multFmt(R_.mult)})`; SFX.win(); renderAll();

/* ---------- Coin Flip between friends ---------- */
const FL = { a: {}, b: {}, pick: 'K', busy: false, seen: new Set(ls.get('flipSeen', [])) };
const flipAll = () => ({ ...FL.a, ...FL.b });
const randHex = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x => x.toString(16).padStart(2, '0')).join(''); };
const flipResult = (sa, sb) => parseInt(sha256(sa + ':' + sb).slice(0, 8), 16) % 2 ? 'K' : 'Z';
const sideName = k => k === 'K' ? 'Kopf' : 'Zahl';
let unsubFA = null, unsubFB = null;
function startFlips(){
  const take = (key) => s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); const before = FL[key]; FL[key] = o; flipsChanged(before); renderAll(); };
  unsubFA = onSnapshot(query(collection(fs, 'flips'), where('a', '==', uid)), take('a'), e => console.warn(e));
  unsubFB = onSnapshot(query(collection(fs, 'flips'), where('b', '==', uid)), take('b'), e => console.warn(e));
}
let flipsFirst = true;
function flipsChanged(before){
  const all = flipAll();
  for (const [id, f] of Object.entries(all)){
    // a new challenge for me
    if (!flipsFirst && f.b === uid && f.st === 'open' && !before[id]) { SFX.pop(); toast(`🪙 ${nameOf(f.a)} fordert dich zum Coin Flip heraus${f.stake ? ` (${fmt(f.stake)} ℒ)` : ''}`); }
    // I challenged, the other accepted: throw the coin with my secret
    if (f.a === uid && f.st === 'accepted' && !f.secretA) revealFlip(id, f);
    // my stake comes back when declined or withdrawn
    if (f.a === uid && (f.st === 'declined' || f.st === 'cancelled') && f.stake > 0 && !f.refA)
      if (withPlayer(d => { const k = id + ':ref'; if (d.fdone?.includes(k)) return false; d.fdone = [...(d.fdone || []), k].slice(-200); d.balance += f.stake; return true; }, 'Coin Flip zurück'))
        updateDoc(doc(fs, 'flips', id), { refA: true }).catch(() => {});
    // the challenger never threw the coin: after 24 h the pot goes to the other player
    if (f.b === uid && f.st === 'accepted' && !f.secretA && f.acceptedAt && Date.now() - (f.acceptedAt.toMillis ? f.acceptedAt.toMillis() : f.acceptedAt) > 864e5 + 60e3)
      updateDoc(doc(fs, 'flips', id), { st: 'done', winner: uid, forfeit: true, doneAt: Date.now() }).catch(() => {});
    // finished: book it once, show the coin once
    if (f.st === 'done' && (f.a === uid || f.b === uid)){
      const won = f.winner === uid;
      if (f.stake > 0) withPlayer(d => { const k = id + ':book'; if (d.fdone?.includes(k)) return false; d.fdone = [...(d.fdone || []), k].slice(-200);
        if (won){ d.balance += f.stake * 2; grant(d, 'flip'); } record(d, 'coinflip', f.stake, won ? f.stake * 2 : 0); return true; }, 'Coin Flip');
      else if (won) withPlayer(d => { if (d.ach.flip) return false; grant(d, 'flip'); return true; });
      if (!FL.seen.has(id) && !flipsFirst){ FL.seen.add(id); ls.set('flipSeen', [...FL.seen].slice(-100)); showFlip(id); }
      else if (flipsFirst){ FL.seen.add(id); }
    }
  }
  if (flipsFirst){ ls.set('flipSeen', [...FL.seen].slice(-100)); flipsFirst = false; }
}
async function revealFlip(id, f){
  if (FL.busy) return; FL.busy = true;
  try {
    const s = await getDoc(doc(fs, 'flipsecrets', id)); if (!s.exists()) return;
    const sa = s.data().s, res = flipResult(sa, f.secretB);
    await updateDoc(doc(fs, 'flips', id), { secretA: sa, res, winner: res === f.pickA ? f.a : f.b, st: 'done', doneAt: Date.now() });
  } catch (e){ console.warn(e); } finally { FL.busy = false; }
}
async function flipChallenge(){
  const b = $('flfriend')?.value, stake = Math.max(0, Math.floor(+($('flstake')?.value || 0)));

  try {

function chartHTML(hist){
  if (!hist || hist.length < 2) return '<p class="muted">Nach ein paar Runden erscheint hier der Verlauf deines Vermögens.</p>';
  // draw at roughly the on-screen width so labels keep their real size
  const W = Math.round(Math.min(1000, Math.max(300, innerWidth - 80))), H = 180, pl_ = 64, pr = 12, pt = 12, pb = 22;
  const vals = hist.map(h=>h.b);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi===lo){ hi += 100; lo = Math.max(0, lo-100); }
  const pad = (hi-lo)*.08; lo = Math.max(0, lo-pad); hi += pad;
  const x = i => pl_ + i*(W-pl_-pr)/(vals.length-1), y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grid = [lo, (lo+hi)/2, hi].map(v => `<line x1="${pl_}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(209,173,98,.15)"/><text x="${pl_-8}" y="${y(v)+4}" text-anchor="end" fill="#a3b7ab" font-size="11" font-family="IBM Plex Mono, monospace">${fmt(v)}</text>`).join('');
  const last = vals.length-1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vermögen der letzten ${vals.length} Runden">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d1ad62" stop-opacity=".35"/><stop offset="1" stop-color="#d1ad62" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polygon points="${x(0)},${H-pb} ${pts} ${x(last)},${H-pb}" fill="url(#ga)"/>
    <polyline points="${pts}" fill="none" stroke="#d1ad62" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="4.5" fill="#d1ad62" stroke="#231a14" stroke-width="2"/>
    <text x="${pl_}" y="${H-5}" fill="#a3b7ab" font-size="11">vor ${vals.length} Runden</text><text x="${W-pr}" y="${H-5}" text-anchor="end" fill="#a3b7ab" font-size="11">jetzt</text>
  </svg></div>`;
}

  const s = p.stats||{}, q = s.hands ? Math.round((s.wins/s.hands)*100) : 0;
  return `<div class="statgrid">
    <div class="stat"><small>Legats</small><b style="color:var(--brass)">${fmt(p.balance)}</b></div>
    <div class="stat"><small>Euro (Bank)</small><b>${fmt(euroOf(p))}</b></div>
    <div class="stat"><small>Vermögen</small><b>${fmt(wealth(p))}</b></div>
    <div class="stat"><small>Hände</small><b>${s.hands||0}</b></div>
    <div class="stat"><small>Gewonnen</small><b style="color:var(--win)">${s.wins||0}</b></div>
    <div class="stat"><small>Verloren</small><b style="color:var(--lose)">${s.losses||0}</b></div>
    <div class="stat"><small>Unentschieden</small><b>${s.pushes||0}</b></div>
    <div class="stat"><small>Blackjacks</small><b>${s.bj||0}</b></div>
    <div class="stat"><small>Siegquote</small><b>${q}%</b></div>
    <div class="stat"><small>Größter Gewinn</small><b>${fmt(s.best||0)}</b></div>
    <div class="stat"><small>Bilanz</small><b style="color:${(s.net||0)>=0?'var(--win)':'var(--lose)'}">${sgn(s.net||0)}</b></div>
    <div class="stat"><small>Pleiten (Niederlagen)</small><b style="color:${s.bankrupts?'var(--lose)':'inherit'}">${s.bankrupts||0}</b></div>
  </div>`;
}
function renderAccountStats(){ const box = $('acc-stats'); if (box && P) box.innerHTML = statsHTML(P); }

/* ---------- modal: player profile & fairness ---------- */
function openModal(kind, id){ modalKind = kind; modalId = id; $('modal').hidden = false; renderModal(true); if (kind === 'flip') requestAnimationFrame(animateFlip); }
function closeModal(){
  if (modalKind === 'dish'){ if (DISH.phase === 'run') return; if (DISH.phase === 'done' && !DISH.collected){ dishCollect(); return; } }
  modalKind = null; modalId = null; $('modal').hidden = true; }
$('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && modalKind) closeModal(); });
let lastModalHTML = '';
function renderModal(force){
  if (!modalKind) return;
  const card = $('modal-card');
  if (!force && card.contains(document.activeElement) && document.activeElement.tagName==='INPUT') return;
  if (modalKind==='wheel' && wheelBusy) return;
  if (modalKind==='dish' && DISH.phase==='run') return;
  if (modalKind==='flip' && !force) return;
  const html = modalKind==='profile' ? profileHTML(modalId) : modalKind==='wheel' ? wheelHTML() : modalKind==='news' ? newsHTML() : modalKind==='dish' ? dishHTML() : modalKind==='flip' ? flipModalHTML() : fairHTML();
  if (!force && html === lastModalHTML) return;
  lastModalHTML = html;
  const keep = $('gamt')?.value;
  card.innerHTML = html;
  if (keep && $('gamt')) $('gamt').value = keep;
}
function newsHTML(){
  const vs = Object.keys(CHANGELOGS).filter(v => verNum(v) > verNum(seenBefore)).sort((a,b) => verNum(b) - verNum(a));
  return `<div class="stack"><div class="row" style="justify-content:space-between"><h2>Neu in Version ${APP_VERSION}</h2><button class="btn sm" data-act="closemodal">Schließen</button></div>
    ${(vs.length ? vs : [APP_VERSION]).map(v => `${vs.length > 1 ? `<h3>Version ${v}</h3>` : ''}<ul class="news">${CHANGELOGS[v].map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
    <button class="btn gold" data-act="closemodal">Los geht's</button></div>`;
}
function profileHTML(id){
  const p = pl(id); if (!p) return '<p class="muted">Spieler nicht gefunden.</p>';
  const me = id===uid, friend = isFriend(id), wk = weekId(), w = p.week?.id===wk ? p.week : { net:0, hands:0 };
  const D = debts(), theyOweMe = D[id]?.[uid] || 0, iOwe = D[uid]?.[id] || 0;
  return `<div class="stack">
    <div class="row" style="justify-content:space-between"><div class="prof-head"><div class="prof-av">${avH(p.avatar||'🙂')}</div><div><h2>${esc(p.name)}</h2>
      <p class="small" style="margin:0 0 2px"><span class="lvl">Lv ${levelOf(p.xp || 0).L}</span> <b style="color:var(--brass)">${esc(titleOf(levelOf(p.xp || 0).L))}</b> <span class="muted">· ${fmt(p.xp || 0)} XP</span></p>
      <p class="muted small"><span class="dot${isOnline(id)?' on':''}"></span>${isOnline(id)?'Online':'Offline'}${me?' · das bist du':friend?' · Freund':''}</p></div></div>
      <button class="btn sm" data-act="closemodal">Schließen</button></div>
    ${statsHTML(p)}
    <p class="muted">Diese Woche: <b class="num" style="color:${w.net>=0?'var(--win)':'var(--lose)'}">${sgn(w.net)} ℒ</b> in ${w.hands} Händen</p>
    ${chartHTML(p.hist)}
    ${suspicious(p) ? '<div class="note bad"><b>⚠️ Kontostand passt nicht zum Kontobuch.</b> Das Guthaben wurde vermutlich am Spiel vorbei geändert.</div>' : ''}
    <h3>Erfolge · ${Object.keys(p.ach||{}).length} von ${ACH.length}</h3>${badgesHTML(p.ach, false)}
    <details class="panel"><summary><b>Kontobuch</b> <span class="muted small">· letzte Änderungen an Legats und Euro</span></summary><div style="margin-top:10px">${logHTML(p)}</div></details>
    ${!me && friend ? `<div class="panel stack"><h3>Legats schicken</h3>
      ${theyOweMe ? `<p>${esc(p.name)} schuldet dir <b class="num">${fmt(theyOweMe)} ℒ</b>.</p>` : ''}${iOwe ? `<p>Du schuldest ${esc(p.name)} <b class="num">${fmt(iOwe)} ℒ</b>.</p>` : ''}
      <div class="field"><label for="gamt">Betrag</label><input id="gamt" type="number" min="100" step="100" inputmode="numeric" placeholder="z. B. 1000"></div>
      <div class="row"><button class="btn gold" data-act="gift" data-id="${esc(id)}">Schenken</button><button class="btn" data-act="loan" data-id="${esc(id)}">Leihen</button>
      ${iOwe ? `<button class="btn" data-act="repay" data-id="${esc(id)}" data-v="${iOwe}">Schulden zurückzahlen</button>` : ''}</div>
      <p class="muted small">Geliehene Legats stehen als Schulden in der Rangliste, bis sie zurückgezahlt sind.</p></div>`
    : !me ? `<button class="btn gold" data-act="befriend" data-id="${esc(id)}">Als Freund hinzufügen</button>` : ''}
  </div>`;
}
function fairHTML(){
  const head = `<div class="row" style="justify-content:space-between"><h2>Fairness</h2><button class="btn sm" data-act="closemodal">Schließen</button></div>`;
  if (!T?.fair) return `<div class="stack">${head}<p class="muted">Ab dem nächsten Mischen gibt es hier den Prüfwert.</p></div>`;
  const F = T.fair, hashOk = sha256(F.orig) === F.hash;
  const key = tid+':'+F.n; if (!fairSeen[key]) fairSeen[key] = F.hash;
  const sameAsSeen = fairSeen[key] === F.hash;
  const rest = (T.shoe||[]).join(''), prefixOk = F.orig.startsWith(rest);
  const ok = hashOk && sameAsSeen && prefixOk;
  const dealt = F.orig.slice(rest.length).match(/../g) || [];
  const ranks = 'A23456789TJQK'.split(''), cnt = Object.fromEntries(ranks.map(r=>[r,0]));
  dealt.forEach(c => cnt[c[0]]++);
  const exp = dealt.length/13, maxC = Math.max(1, ...Object.values(cnt), exp);
  const small = dealt.filter(c => c[0]==='A' || cval(c) < 9).length;
  return `<div class="stack">${head}
    <div class="note ${ok?'':'bad'}"><b>${ok ? '✓ Schlitten unverändert seit dem Mischen' : '✗ Der Schlitten passt nicht zum Prüfwert'}</b></div>
    <p class="muted">Beim Mischen wird die Reihenfolge aller 312 Karten festgelegt und ein Fingerabdruck (SHA-256) davon gespeichert. Danach kommen die Karten nur in genau dieser Reihenfolge aus dem Schlitten. Dein Browser rechnet den Fingerabdruck selbst nach und merkt ihn sich. Würde jemand die Karten nachträglich umsortieren, stünde hier ein rotes ✗.</p>
    <div class="statgrid">
      <div class="stat"><small>Mischung Nr.</small><b>${F.n}</b></div>
      <div class="stat"><small>Ausgeteilt</small><b>${dealt.length} / 312</b></div>
      <div class="stat"><small>Karten A–8</small><b>${dealt.length ? Math.round(small/dealt.length*100) : 0}%</b></div>
    </div>
    <p class="muted small">Fingerabdruck: <span class="num" style="word-break:break-all">${F.hash}</span></p>
    <h3>Ausgeteilte Karten dieser Mischung</h3>
    <div class="bars">${ranks.map(r => `<div class="${cnt[r] > exp ? 'hi':''}" style="height:${(cnt[r]/maxC*100).toFixed(1)}%" title="${r==='T'?'10':r}: ${cnt[r]}"></div>`).join('')}</div>
    <div class="barlbl">${ranks.map(r => `<span>${r==='T'?'10':r}</span>`).join('')}</div>
    <p class="muted small">Erwartet sind pro Wert etwa ${exp.toLocaleString('de-DE',{maximumFractionDigits:1})} Karten. Karten von Ass bis 8 machen im Schlitten 61,5 % aus.</p>
  </div>`;
}

let rq = false;
function renderAll(){
  if (rq || !uid) return; rq = true;
  requestAnimationFrame(() => {
    rq=false; renderTop();
    const typing = el => { const a=document.activeElement; return a && (a.tagName==='INPUT' || a.tagName==='SELECT') && a.type!=='checkbox' && el.contains(a); };
    if (tab==='table') renderCasino();
    if (tab==='players' && !typing($('view-players'))) renderPlayers();
    if (tab==='bank' && !typing($('view-bank'))) renderBank();
    if (tab==='chat') renderChatTab();
    renderTabBadges();
    if (tab==='shop') renderShop();
    if (tab==='account'){ if (typing($('view-account'))) renderAccountStats(); else renderAccount(); }
    renderModal(false);
    tickTimers();
  });
}
function tickTimers(){
  for (const el of document.querySelectorAll('[data-mmss]')){
    const left = +el.dataset.mmss - Date.now(); el.textContent = mmss(left);
    if (left <= 0 && !el.dataset.done){ el.dataset.done = '1'; lastTableHTML = ''; renderAll(); }
  }
  for (const el of document.querySelectorAll('[data-until]')) el.textContent = Math.max(0, Math.ceil((+el.dataset.until - Date.now())/1000));
}
function renderTabBadges(){
  const n = unreadChats().length, f = Object.values(flipAll()).filter(x => x.b === uid && x.st === 'open').length;
  const set = (id, label, k) => { const b = $(id); const h = label + (k ? `<span class="tabbadge">${k}</span>` : ''); if (b.innerHTML !== h) b.innerHTML = h; };
  set('tab-chat', 'Chat', n); set('tab-account', 'Konto', f);
}
function setTab(t){
  if (tab === 'chat' && t !== 'chat' && CH.open) closeChat();
  tab = t; shopConfirm = null;
  for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', b.dataset.tab===t);
  for (const v of ['table','players','chat','bank','shop','account']) $('view-'+v).hidden = v!==t;
  if (t==='table') { lastTableHTML = ''; anim.prime = true; }
  renderAll();
}

/* ---------- events ---------- */
async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast(label+' kopiert'); } catch { toast(label+': '+text); }
}
$('mute').addEventListener('click', () => { snd.on = !snd.on; ls.set('sound', snd.on); if (snd.on) SFX.chip(); renderTop(); });
document.addEventListener('change', e => {
  if (e.target.id==='autobet'){
    auto = e.target.checked; ls.set('autobet', auto);
    toast(auto ? `Auto-Einsatz an: ${fmt(ls.get('lastBet', bet))} ℒ jede Runde` : 'Auto-Einsatz aus');
    if (auto){ autoRound = null; afterTable(); }
    e.target.blur(); renderAll();
  }
});
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb){ setTab(tb.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a!=='leave' && a!=='home' && a!=='game') confirmLeave = false;
  if (a!=='shop') shopConfirm = null;
  switch (a){
    case 'create': case 'createvip': b.disabled = true; await createTable(a==='createvip'); b.disabled = false; break;
    case 'join': toast('Du setzt dich an den Tisch …'); sitAt(b.dataset.id); break;
    case 'joincode': await joinByCode($('tcode').value); break;
    case 'leave': leaveTable(); break;
    case 'copytable': copy(tid, 'Tisch-Code'); break;
    case 'copycode': copy(P.code, 'Freundescode'); break;
    case 'bq': { const i = $(b.dataset.f), base = b.dataset.f==='bdep' ? P.balance : P.euro, q = +b.dataset.q;
      i.value = q===1 ? base : Math.floor(base*q/50)*50; bankInfo(); break; }
    case 'deposit': if (bankMove('deposit', +$('bdep').value)){ $('bdep').value=''; lastBankHTML=''; } document.activeElement?.blur(); renderAll(); break;
    case 'withdraw': if (bankMove('withdraw', +$('bwd').value)){ $('bwd').value=''; lastBankHTML=''; } document.activeElement?.blur(); renderAll(); break;
    case 'copyinvite': copy(inviteLink(), 'Einladungslink'); break;
    case 'shareinvite': navigator.share({ title:'Legat Casino', text:`Spiel mit mir Blackjack im Legat Casino! Mit meinem Link bekommst du ${fmt(REF_BONUS)} Legats extra.`, url: inviteLink() }).catch(()=>{}); break;
    case 'chip': bet = Math.min(MAX_BET, P.balance, bet + +b.dataset.v); SFX.chip(); renderAll(); break;
    case 'betclear': bet = 0; renderAll(); break;
    case 'betmax': bet = Math.max(0, Math.min(MAX_BET, Math.floor(P.balance/50)*50)); SFX.chip(); renderAll(); break;
    case 'bet': placeBet(bet); break;
    case 'unbet': unBet(); if (auto){ auto=false; ls.set('autobet', false); toast('Auto-Einsatz aus'); } break;
    case 'hit': case 'stand': case 'double': case 'split': case 'surrender': act(a); break;
    case 'insure': insure(true); break;
    case 'noinsure': insure(false); break;
    case 'emoji': sendMsg(b.dataset.e, 'e'); break;
    case 'fair': openModal('fair'); break;
    case 'profile': openModal('profile', b.dataset.id); break;
    case 'closemodal': closeModal(); break;
    case 'revive': if (isBroke() && Date.now() >= reviveAt()){ Object.assign(DISH, { phase:'intro', collected:false }); openModal('dish'); } break;
    case 'dishstart': dishStart(); break;
    case 'dishcollect': dishCollect(); break;
    case 'daily': {
      b.disabled = true;
      let got = 0, streak = 0;
      withPlayer(d => { WHY = 'Tagesbonus';
        const today = dayId(); if (d.daily.last === today) return false;
        streak = d.daily.last === dayId(Date.now()-864e5) ? d.daily.streak + 1 : 1;
        got = dailyAmount(streak); d.balance += got; d.daily = { last: today, streak };
        if (streak >= 7) grant(d,'daily7');
        return true;
      });
      if (got){ SFX.coins(); toast(`+${fmt(got)} ℒ · Tag ${streak} in Folge`); }
      break;
    }
    case 'mode': boardMode = b.dataset.v; renderAll(); break;
    case 'scope': boardScope = b.dataset.v; renderAll(); break;
    case 'addfriend': case 'befriend': {
      let hit;
      if (a==='befriend') hit = [b.dataset.id, players[b.dataset.id]];
      else {
        const code = $('fcode').value.trim().toUpperCase();
        hit = Object.entries(players).find(([id,p]) => p.code===code);
        if (!hit) return toast('Kein Spieler mit diesem Code.');
      }
      if (hit[0]===uid) return toast('Das ist dein eigener Code.');
      if (friendIds().includes(hit[0])) return toast('Ihr seid schon befreundet.');
      withPlayer(d => { d.friends = [...new Set([...(d.friends||[]), hit[0]])]; return true; });
      if ($('fcode')) $('fcode').value=''; document.activeElement?.blur(); toast('Du bist jetzt mit '+hit[1].name+' befreundet'); renderModal(true); break;
    }
    case 'gift': case 'loan': {
      const v = parseInt($('gamt')?.value, 10);
      sendGift(b.dataset.id, v, a); if ($('gamt')) $('gamt').value=''; document.activeElement?.blur(); renderModal(true); break;
    }
    case 'repay': {
      const owed = +b.dataset.v, typed = parseInt($('gamt')?.value, 10);
      const v = Math.min(owed, typed > 0 ? typed : owed, P.balance);
      sendGift(b.dataset.id, v, 'repay'); renderModal(true); break;
    }
    case 'shop': {
      const kind = b.dataset.kind, id = b.dataset.id, price = +b.dataset.price, key = kind+':'+id;
      const owned = price===0 || P.owned.includes(key);
      if (!owned){
        if (P.euro < price) return toast(`Dafür fehlen dir ${fmt(price - P.euro)} € auf der Bank.`);
        if (shopConfirm !== key){ shopConfirm = key; renderAll(); return; }
      }
      shopConfirm = null;
      const ok = withPlayer(d => { WHY = 'Shop';
        if (!owned){ if (d.euro < price || d.owned.includes(key)) return false; d.euro -= price; d.owned = [...d.owned, key]; }
        if (kind==='av') d.avatar = id; else d.sel = { ...d.sel, [kind]: id };
        return true;
      });
      if (ok && !owned){ SFX.coins(); toast('Gekauft und ausgewählt'); }
      break;
    }
    case 'savename': {
      const n = $('aname').value.trim().slice(0,20);
      if (!n) return toast('Bitte gib einen Namen ein.');
      withPlayer(d => { if (d.name===n) return false; d.name = n; return true; });
      document.activeElement?.blur(); toast('Name gespeichert'); renderAll(); break;
    }
    case 'savelimits': {
      const w = parseInt($('lwin').value,10), l = parseInt($('lloss').value,10);
      if ((w && w<100) || (l && l<100)) return toast('Limits ab 100 Legats, oder leer lassen.');
      withPlayer(d => { d.limits = { win: w>0?w:null, loss: l>0?l:null, base: d.limits?.base ?? d.balance }; return true; });
      document.activeElement?.blur(); toast('Limits gespeichert'); renderAll(); break;
    }
    case 'newsession':
      withPlayer(d => { d.limits = { ...(d.limits||{}), base: d.balance }; return true; });
      toast('Neue Session ab '+fmt(P.balance)+' ℒ'); renderAll(); break;
    case 'logout': await signOut(auth); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key!=='Enter') return;
  if (e.target.id==='tcode') joinByCode(e.target.value);
  if (e.target.id==='fcode') document.querySelector('[data-act="addfriend"]')?.click();
});
</script>
