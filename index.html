<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legat Casino</title>
<meta name="theme-color" content="#17110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legat Casino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single felt table under a wooden rail; tabs switch Tisch / Spieler / Shop / Konto. One dark "casino at night" look. */
:root{
  --felt:#0f3d2f; --felt-deep:#0a2a20; --rail:#17110d; --rail-2:#231a14;
  --brass:#d1ad62; --brass-dim:#8f7643; --ink:#f2ebdd; --muted:#a3b7ab;
  --card:#fbf8f1; --card-ink:#1b1b1f; --suit-red:#c4382a;
  --win:#79d8a2; --lose:#ec8a78; --push:#e7cf8f;
  --line:rgba(209,173,98,.28);
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--rail);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 70% at 50% 0%, var(--rail-2), var(--rail) 70%);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rail);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:auto;white-space:nowrap}
.logo span{color:var(--brass)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.purse{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.purse small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.purse b{font-family:var(--f-num);font-size:19px;color:var(--brass);transition:color .3s}
.purse b.up{color:var(--win)} .purse b.down{color:var(--lose)}
nav.tabs{display:flex;gap:4px;width:100%;}
nav.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px;color:var(--muted);font-weight:600;letter-spacing:.04em}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}

.panel{background:var(--rail-2);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:500;font-size:24px;margin:0 0 4px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.btn{border:1px solid var(--brass-dim);background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;letter-spacing:.02em}
.btn:hover{border-color:var(--brass)}
.btn.gold{background:var(--brass);color:#1b140a;border-color:var(--brass)}
.btn.gold:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);min-width:0;width:100%}
.code{font-family:var(--f-num);font-size:22px;letter-spacing:.14em;color:var(--brass)}
.note{border-left:3px solid var(--brass);padding:8px 12px;background:rgba(209,173,98,.08);border-radius:0 8px 8px 0}
.note.bad{border-color:var(--lose);background:rgba(236,138,120,.08)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--rail);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;user-select:none;flex-wrap:wrap;justify-content:center}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:#3b332b;position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{transform:translateX(16px)}

/* daily bonus banner */
.daily{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(90deg,rgba(209,173,98,.22),rgba(209,173,98,.06));border:1px solid var(--brass-dim);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.daily b{color:var(--brass)}
.streak{display:flex;gap:4px}
.streak i{width:10px;height:10px;border-radius:50%;background:#3b332b;display:block}
.streak i.on{background:var(--brass)}

/* login */
.login{max-width:440px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.login h1{font-family:var(--f-display);font-size:40px;font-weight:700;margin:0;line-height:1.05}
.login h1 span{color:var(--brass)}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.gbtn svg{width:20px;height:20px}
.fan{display:flex;justify-content:center;height:110px;position:relative;width:200px}
.fan .c{position:absolute;top:10px;transform-origin:50% 120%}

/* table */
.felt{--f1:#175a45;--f2:#0f3d2f;--f3:#0a2a20;--b1:#7d2a22;--b2:#6a221c;position:relative;background:radial-gradient(110% 90% at 50% 10%, var(--f1), var(--f2) 45%, var(--f3));border-radius:28px 28px 14px 14px;border:10px solid #3a2617;box-shadow:inset 0 0 0 2px var(--brass-dim), 0 20px 40px rgba(0,0,0,.45);padding:18px 14px 20px;overflow:hidden}
.felt.vip{border-color:#5a4417;box-shadow:inset 0 0 0 2px var(--brass), 0 0 0 1px var(--brass), 0 20px 40px rgba(0,0,0,.45)}
.felt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;position:relative;z-index:1;padding-right:56px}
.tcode{font-family:var(--f-num);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tcode b{color:var(--brass);letter-spacing:.12em;font-size:15px}
.vipbadge{font-family:var(--f-display);font-weight:700;color:#1b140a;background:var(--brass);border-radius:4px;padding:1px 7px;font-size:12px;letter-spacing:.1em}
.shoe{position:absolute;right:18px;top:20px;width:46px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--b1) 0 6px,var(--b2) 6px 12px);border:3px solid var(--card);box-shadow:3px 3px 0 -1px var(--card),6px 6px 0 -2px var(--card),0 8px 14px rgba(0,0,0,.4);transform:rotate(8deg)}
.arc{font-family:var(--f-display);text-align:center;color:rgba(242,235,221,.55);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 2px;padding-inline:52px}
.arc em{font-style:normal;color:var(--brass)}
.dealer{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{min-height:24px;text-align:center;font-weight:700;color:var(--push)}
.hand{display:flex;justify-content:center}
.cards{display:flex;min-height:20px}
.cards .c + .c{margin-left:-22px}

/* a card: outer box flies, inner box flips */
.c{width:60px;height:86px;position:relative;flex:none;perspective:700px;font-family:var(--f-display);font-weight:700}
.ci{position:absolute;inset:0;transform-style:preserve-3d}
.c.down .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.cf{background:var(--card);color:var(--card-ink)}
.cb{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--b1) 0 6px,var(--b2) 6px 12px);border:3px solid var(--card)}
.c.red .cf{color:var(--suit-red)}
.cf .r{position:absolute;top:4px;left:6px;font-size:19px;line-height:1}
.cf .s{position:absolute;top:22px;left:6px;font-size:15px;line-height:1}
.cf .big{position:absolute;right:6px;bottom:2px;font-size:30px;line-height:1}
.score{font-family:var(--f-num);font-size:13px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 9px}

.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.seat{border:1px dashed rgba(242,235,221,.22);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:box-shadow .3s;position:relative}
.seat.me{border-style:solid;border-color:var(--brass)}
.seat.turn{box-shadow:0 0 0 2px var(--brass),0 0 22px rgba(209,173,98,.35)}
.seat .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-size:12px;color:var(--muted)}
.seat .c{width:44px;height:63px}
.seat .cf .r{font-size:15px}.seat .cf .s{font-size:12px;top:19px}.seat .cf .big{font-size:21px}
.seat .cards .c + .c{margin-left:-20px}
.seat.me .c{width:60px;height:86px}
.seat.me .cf .r{font-size:19px}.seat.me .cf .s{font-size:15px;top:22px}.seat.me .cf .big{font-size:30px}
.bubble{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--ink);color:var(--rail);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2;animation:bub 5s ease-out both;pointer-events:none}
.bubble.emo{font-size:26px;background:none;padding:0;top:-22px}
@keyframes bub{0%{transform:translate(-50%,8px) scale(.5);opacity:0}8%{transform:translate(-50%,0) scale(1.1);opacity:1}14%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.hands{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:8px}
.hbox.active{background:rgba(209,173,98,.14)}
.hbox.won .cards{animation:glow 1.4s ease-out 1}
@keyframes glow{0%{filter:drop-shadow(0 0 0 rgba(121,216,162,0))}40%{filter:drop-shadow(0 0 14px rgba(121,216,162,.9))}100%{filter:drop-shadow(0 0 0 rgba(121,216,162,0))}}
.chip-bet{font-family:var(--f-num);font-size:12px;color:var(--brass)}
.res{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;animation:pop .35s ease-out both}
.res.win,.res.bj{color:var(--win)} .res.lose{color:var(--lose)} .res.push,.res.surr{color:var(--push)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.net{font-size:20px;font-weight:700;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}

.controls{margin-top:14px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{width:54px;height:54px;border-radius:50%;border:4px dashed rgba(255,255,255,.75);font-family:var(--f-num);font-weight:600;font-size:12px;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);display:grid;place-items:center;transition:transform .12s}
.chip:active{transform:translateY(2px) scale(.96)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.ch100{background:#3d6fb6}.ch500{background:#7b3fa0}.ch1k{background:#b8432f}.ch5k{background:#2f8a55}.ch10k{background:#1f1f24}.ch25k{background:#b48a2c}
.betline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.betval{font-family:var(--f-num);font-size:24px;color:var(--brass);min-width:7ch;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.acts .btn{min-width:110px}
.timer{font-family:var(--f-num);font-size:12px;color:var(--muted)}

/* chat */
.chat{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{background:var(--rail);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:20px;display:grid;place-items:center}
.emojis button:active{transform:scale(.9)}
.chatlog{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto;font-size:14px;padding-right:4px}
.chatlog .m b{color:var(--brass);margin-right:6px}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;background:var(--rail);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--ink)}

/* players */
table.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:10px 8px;border-bottom:1px solid rgba(209,173,98,.12);white-space:nowrap}
.board tbody tr{cursor:pointer}
.board tbody tr:hover td{background:rgba(209,173,98,.05)}
.board td.r,.board th.r{text-align:right}
.board tr.me td{background:rgba(209,173,98,.07)}
.scroll{overflow-x:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55625b;margin-right:7px;vertical-align:1px}
.dot.on{background:var(--win);box-shadow:0 0 6px var(--win)}
.av{display:inline-block;width:1.5em;text-align:center;margin-right:4px}
.rank{font-family:var(--f-display);color:var(--brass);font-size:17px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.bad{color:var(--lose);border-color:rgba(236,138,120,.45)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1b140a}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--f-num);font-size:18px}
.lobby-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}

/* achievements */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.badge .ic{font-size:24px;line-height:1}
.badge b{display:block;font-size:13px}
.badge span{display:block;font-size:11px;color:var(--muted)}
.badge.locked{opacity:.35;filter:grayscale(1)}
.badge.shame{border-color:rgba(236,138,120,.45)}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);text-align:center}
.item.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.item .big{font-size:34px;line-height:1.1}
.item .sw{width:70px;height:48px;border-radius:8px;border:3px solid #3a2617}
.item .bk{width:38px;height:54px;border-radius:5px;border:3px solid var(--card)}
.item small{font-size:12px;color:var(--muted)}
.item .price{font-family:var(--f-num);font-size:12px;color:var(--brass)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column;gap:2px;font-size:13px}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(209,173,98,.1)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,7,5,.72);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--rail-2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.modal{align-items:center}.modal-card{border-radius:16px}}
.prof-head{display:flex;gap:14px;align-items:center}
.prof-av{font-size:44px;line-height:1;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--rail);border:1px solid var(--line);flex:none}
.bars{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;align-items:end;height:110px}
.bars div{background:var(--brass-dim);border-radius:3px 3px 0 0;min-height:2px}
.bars div.hi{background:var(--brass)}
.barlbl{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;font-family:var(--f-num);font-size:11px;text-align:center;color:var(--muted)}

@media (max-width:520px){
  .c{width:50px;height:72px}.cf .r{font-size:16px}.cf .s{font-size:13px;top:19px}.cf .big{font-size:24px}
  .seat.me .c{width:52px;height:75px}
  .chip{width:48px;height:48px;font-size:11px}
  .acts .btn{min-width:0;flex:1 1 40%}
  .felt{border-width:7px;padding:14px 8px 16px}
  .shoe{right:10px;top:14px;width:36px;height:50px}
  .logo{font-size:19px}
  nav.tabs button{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="logo">Legat <span>Casino</span></div>
    <button class="iconbtn" id="mute" type="button" aria-label="Ton an/aus">🔊</button>
    <div class="purse"><small id="pname">Konto</small><b id="pbal">–</b></div>
    <nav class="tabs" role="tablist">
      <button id="tab-table" role="tab" aria-selected="true" data-tab="table">Tisch</button>

function slow(pr){

  return pr.finally(() => clearTimeout(t));
}
function handleWriteErr(e){

function norm(d){

  d.friends ||= []; d.limits ||= { win:null, loss:null, base:d.balance };
  d.avatar ||= '🙂'; d.owned ||= []; d.sel ||= { felt:'green', back:'red' };
  d.daily ||= { last:null, streak:0 }; d.hist ||= []; d.ach ||= {}; d.streaks ||= { win:0, bj:0 };
  d.claimed ||= []; d.giftedTotal ||= 0; if (d.lowMark == null) d.lowMark = d.balance;

}

function genCode(len, alpha='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'){ let s=''; for(let i=0;i<len;i++) s+=alpha[rnd(alpha.length)]; return s; }
const pl = id => id===uid ? P : players[id];

function friendIds(){
  if (!P) return [];

  for (const [id,p] of Object.entries(players)) if ((p.friends||[]).includes(uid)) s.add(id);

}
const isFriend = id => friendIds().includes(id);
function limitState(){
  const L = P?.limits; if (!L || (!L.win && !L.loss)) return null;
  const profit = P.balance - L.base;
  if (L.win && profit >= L.win) return {hit:'win', profit};

}
const ledgerOpen = d => !!(d?.ledger && !d.ledger.settled);

function grant(d, key){ if (!d.ach[key]){ d.ach[key] = Date.now(); newBadges.push(key); } }
function checkBalanceBadges(d){

/** debts[debtor][creditor] = amount still owed */
function debts(){
  const m = {};
  const add = (a,b,v) => { (m[a] ||= {}); m[a][b] = (m[a][b]||0) + v; };
  for (const g of Object.values(gifts)){

  for (const a in m) for (const b in m[a]) if (m[a][b] <= 0) delete m[a][b];

}

function sendGift(to, amount, kind){
  amount = Math.floor(amount);

}

function openTable(id){

  closeTable();

  setTimeout(leaseLoop, 300);

    T = s.data(); pendingAct = false; reconcile(); afterTable(); renderAll();
  }, e => console.warn(e));
  unsubS = onSnapshot(query(collection(fs,'seats'), where('table','==',id)), s => {
    const n = {}; s.docs.forEach(d => n[d.id] = d.data()); seats = n;

      seatHealed = true; seatWrite({ table:id, joined:Date.now(), ready:false, round:-1, bet:0, act:null }, 'set');

  }, e => console.warn(e));

      const m = ch.doc.data(); bubbles[m.u] = { x:m.x, k:m.k, at:Date.now() };

    }
    first = false; renderChat(); renderAll();
  }, e => console.warn(e));
}
function closeTable(){

}
async function createTable(vip){
  if (vip && P.balance < VIP_MIN) return toast(`Für einen VIP-Tisch brauchst du mindestens ${fmt(VIP_MIN)} Legats.`);

  for (let i=0;i<5;i++){ id = genCode(5); const s = await getDoc(doc(fs,'tables',id)); if (!s.exists()) break; }
  const t = { name: (P?.name||'Spieler')+'s Tisch', owner: uid, min: vip ? VIP_MIN : MIN_BET, phase:'betting', round:1, shoe:[], dealer:[], hands:{}, order:[],
    turn:null, history:{}, acts:{}, reveal:false, betUntil:null, created:Date.now() };

  try { await slow(setDoc(doc(fs,'tables',id), t)); } catch(e){ return handleWriteErr(e); }
  sitAt(id);
}
async function joinByCode(code){
  code = (code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length !== 5) return toast('Ein Tisch-Code hat 5 Zeichen.');
  const s = await getDoc(doc(fs,'tables',code));

  const c = await getDocs(query(collection(fs,'seats'), where('table','==',code)));
  const active = c.docs.filter(d => d.id!==uid && isOnline(d.id) && players[d.id]?.table===code).length;
  if (active >= MAX_SEATS) return toast('Der Tisch ist voll (5 Plätze).');

function sitAt(id){

function leaveTable(){
  const mid = T && T.hands && T.hands[uid] && T.phase!=='betting' && T.phase!=='done';
  if (mid && !confirmLeave){ confirmLeave = true; renderAll(); return; }
  confirmLeave = false; leaving = true;
  seatWrite(null,'delete');
  withPlayer(d => { d.table = null; return true; });

/* ---------- player actions ---------- */
function canBet(amount){
  const lim = limitState();
  if (lim?.hit) return lim.hit==='win' ? 'Gewinnziel erreicht. Starte im Konto eine neue Session.' : 'Stop-Loss erreicht. Starte im Konto eine neue Session.';
  if (amount < tableMin()) return `Mindesteinsatz an diesem Tisch: ${fmt(tableMin())} Legats.`;
  if (amount > MAX_BET) return 'Höchsteinsatz: 50.000 Legats.';
  if (amount > P.balance) return 'Nicht genug Legats.';
  return null;
}
function placeBet(amount = bet){
  if (!T || T.phase!=='betting') return false;
  const err = canBet(amount); if (err){ toast(err); return false; }
  ls.set('lastBet', amount); bet = amount;
  seatWrite({ ready:true, round:T.round, bet:amount });
  SFX.chip();
  return true;
}
function unBet(){ seatWrite({ ready:false }); }
function act(type){
  if (!T || T.phase!=='playing' || !T.turn || T.turn.u!==uid || pendingAct) return;
  const H = T.hands[uid][T.turn.h];
  if ((type==='double' || type==='split') && P.balance < H.bet) return toast('Nicht genug Legats für '+(type==='double'?'Verdoppeln':'Teilen')+'.');
  pendingAct = true; renderAll();
  seatWrite({ act: { type, h:T.turn.h, round:T.round, seq:Date.now() } });
  setTimeout(()=>{ if(pendingAct){ pendingAct=false; renderAll(); } }, 4000);
}
function insure(yes){
  if (!T || T.phase!=='insurance' || !T.hands?.[uid] || T.insDone?.[uid] || pendingAct) return;
  const cost = Math.floor(T.hands[uid][0].bet/2);
  if (yes && P.balance < cost) return toast('Nicht genug Legats für die Versicherung.');
  pendingAct = true; renderAll();
  seatWrite({ act: { type: yes ? 'insure' : 'noinsure', h:-1, round:T.round, seq:Date.now() } });
  setTimeout(()=>{ if(pendingAct){ pendingAct=false; renderAll(); } }, 4000);
}
/** runs after every table update: auto bet, sounds */
let lastTurnKey = null, lastDoneKey = null;
function afterTable(){
  if (!T || !P) return;
  // auto bet: repeat the last bet at the start of every round
  if (auto && T.phase==='betting' && autoRound !== T.round && seats[uid]){
    const s = seats[uid];
    if (!(s.ready && s.round===T.round)){
      autoRound = T.round;
      const amount = ls.get('lastBet', bet);
      const err = isBroke() ? 'Du bist pleite.' : canBet(amount);
      if (err){ auto = false; ls.set('autobet', false); toast('Auto-Einsatz gestoppt: ' + err); }
      else { const r = T.round; setTimeout(() => { if (auto && T?.phase==='betting' && T.round===r) placeBet(amount); }, 700); }
    }
  }
  const tk = T.turn && T.turn.u===uid && T.phase==='playing' ? `${tid}-${T.round}-${T.turn.h}` : null;
  if (tk && tk !== lastTurnKey) SFX.turn();
  lastTurnKey = tk;
  const r = T.phase==='done' ? T.history?.[T.round]?.[uid] : null;
  const dk = r ? `${tid}-${T.round}` : null;
  if (dk && dk !== lastDoneKey){
    const hs = T.hands[uid] || [];
    if (hs.some(H=>H.res==='bj')) SFX.bj(); else if (r.pay > r.bet) SFX.win();
    else if (hs.length && hs.every(H=>H.st==='bust')) SFX.bust(); else if (r.pay === r.bet) SFX.push(); else SFX.lose();
  }
  lastDoneKey = dk;
}

/* ---------- money: reconcile my balance with the table ---------- */
function applyResult(d, r, ctx){
  d.balance += r.pay;
  const st = d.stats, net = r.pay - r.bet;
  st.hands += r.n; st.wins += r.w; st.losses += r.l; st.pushes += r.p; st.bj += r.bj;
  st.net += net; st.best = Math.max(st.best||0, net);
  d.week.net += net; d.week.hands += r.n; d.week.best = Math.max(d.week.best, net);
  d.hist = [...d.hist, { t:Date.now(), b:d.balance, n:net, w:r.bet }].slice(-60);
  d.streaks.win = net > 0 ? d.streaks.win + 1 : net < 0 ? 0 : d.streaks.win;
  d.streaks.bj = r.bj > 0 ? d.streaks.bj + 1 : 0;
  if (r.w > 0) grant(d,'first_win');
  if (r.bj > 0) grant(d,'bj');
  if (d.streaks.bj >= 3) grant(d,'bj3');
  if (d.streaks.win >= 5) grant(d,'win5');
  if (st.hands >= 100) grant(d,'h100');
  if (st.hands >= 1000) grant(d,'h1000');
  if (r.insPay > 0) grant(d,'ins');
  if (ctx){
    const hs = ctx.hands || [];
    if (ctx.vip) grant(d,'vip');
    if (hs.some(H => H.res==='win' && H.c.length>=5 && score(H.c).t===21)) grant(d,'five21');
    if (hs.some(H => H.res==='win' && H.dbl)) grant(d,'dbl');
    if (hs.length>=2 && hs.every(H => H.res==='win')) grant(d,'split2');
    if (hs.some(H => H.bet >= 50000 && !H.dbl)) grant(d,'high');
  }
}
function reconcile(){
  if (!P || !T || !tid) return;
  withPlayer(d => {
    let changed = false;
    const key = tid+':'+T.round;
    const L = d.ledger;
    if (L && !L.settled && L.key !== key){
      const [lt, lr] = L.key.split(':');
      const h = lt===tid ? T.history?.[lr]?.[uid] : null;
      if (h) applyResult(d, h, null);
      else { d.stats.hands += 1; d.stats.losses += 1; d.stats.net -= L.committed; d.week.net -= L.committed; d.streaks.win = 0; d.streaks.bj = 0; }
      d.ledger = { ...L, settled:true }; changed = true;
    }
    const mine = T.hands?.[uid];
    if (mine && T.phase!=='betting'){
      const committed = mine.reduce((s,h)=>s+h.bet, 0) + (T.ins?.[uid] || 0);
      if (!d.ledger || d.ledger.key !== key){ d.ledger = { key, committed:0, settled:false }; changed = true; }
      if (!d.ledger.settled && committed > d.ledger.committed){
        d.balance = Math.max(0, d.balance - (committed - d.ledger.committed)); d.ledger.committed = committed;
        d.lowMark = Math.min(d.lowMark, d.balance); changed = true;
      }
      if (T.phase==='done' && !d.ledger.settled){
        const h = T.history?.[T.round]?.[uid];
        if (h){ applyResult(d, h, { hands: mine, vip: (T.min||0) >= VIP_MIN }); d.ledger.settled = true; changed = true; }
      }
    }
    return changed;
  });
}

/* ---------- dealer: one browser at the table runs it (lease) ---------- */
async function leaseLoop(){
  if (!tid || !uid){ amHost=false; return; }
  const ref = doc(fs,'locks',tid);
  try {
    amHost = await runTransaction(fs, async tx => {
      const s = await tx.get(ref); const d = s.exists() ? s.data() : {}; const now = Date.now();
      if (!d.holder || d.holder===uid || (d.exp||0) < now){
        if (d.holder===uid && (d.exp||0) - now > 8000) return true;
        tx.set(ref, { holder: uid, exp: now + 15000 }); return true;
      }
      return false;
    });
  } catch(e){ amHost = false; }
}
function presentSeat(u){ return !!seats[u] && isOnline(u) && (u===uid || players[u]?.table===tid); }
function reshuffle(nt){
  nt.shoe = newShoe(); const orig = nt.shoe.join('');
  nt.fair = { n: (nt.fair?.n || 0) + 1, orig, hash: sha256(orig), round: nt.round };
}
function draw(nt){ if (!nt.shoe.length) reshuffle(nt); return nt.shoe.pop(); }
function nextTurn(nt, fromU, fromH, now){
  const order = nt.order; let i = fromU ? order.indexOf(fromU) : 0;
  for (; i<order.length; i++){
    const u = order[i], hs = nt.hands[u];
    for (let h = (u===fromU ? fromH+1 : 0); h<hs.length; h++){
      const H = hs[h];
      if (H.st !== 'play') continue;
      if (H.c.length===1) H.c.push(draw(nt));
      if (score(H.c).t >= 21){ H.st = score(H.c).t>21 ? 'bust' : 'stand'; continue; }
      return { u, h, until: now + TURN_MS };
    }
  }
  return null;
}
function advance(nt, now){
  const t = nextTurn(nt, nt.turn?.u, nt.turn?.h ?? -1, now);
  if (t) nt.turn = t; else { nt.turn = null; nt.phase = 'dealer'; nt.dAt = now; }
}

    for (const H of nt.hands[u]){

      if (H.st==='surr'){ H.res='surr'; H.pay=Math.floor(H.bet/2); }

      else if (nat && !dBJ){ H.res='bj'; H.pay=Math.floor(H.bet*2.5); }
      else if (dBJ){ H.res = nat?'push':'lose'; H.pay = nat?H.bet:0; }
      else if (d>21 || s>d){ H.res='win'; H.pay=H.bet*2; }

function step(nt, now){

      const ready = present.filter(([,s]) => s.ready && s.round===nt.round && s.bet>=min && s.bet<=MAX_BET);
      if (!ready.length){ if (nt.betUntil){ nt.betUntil=null; return true; } return false; }
      if (!nt.betUntil){ nt.betUntil = now + BET_MS; if (ready.length < present.length) return true; }
      if (ready.length === present.length || now >= nt.betUntil){ deal(nt, ready, now); return true; }
      return false;
    }
    case 'insurance': {
      let changed = false;
      for (const u of nt.order){
        const s = seats[u];
        if (s?.act && s.act.round===nt.round && s.act.seq > (nt.acts[u]||0) && (s.act.type==='insure' || s.act.type==='noinsure')){

        }

      const all = nt.order.every(u => nt.insDone[u] || !seats[u]);
      if (all || now >= nt.insUntil){
        if (score(nt.dealer).t===21){ nt.phase='dealer'; nt.dAt=now; }
        else startPlay(nt, now);
        return true;
      }
      return changed;
    }
    case 'playing': {
      const t = nt.turn; if (!t){ nt.phase='dealer'; nt.dAt=now; return true; }
      const s = seats[t.u];
      if (s && s.act && s.act.round===nt.round && s.act.seq > (nt.acts[t.u]||0)){
        nt.acts[t.u] = s.act.seq;
        if (s.act.h === t.h) applyAct(nt, s.act.type, now);
        return true;
      }
      if (now > t.until || !seats[t.u]){ nt.hands[t.u][t.h].st='stand'; advance(nt, now); return true; }
      return false;
    }
    case 'dealer': {

}

/* ---------- card animation: cards fly out of the shoe and flip ---------- */
const anim = { seen: new Map(), prime: false };
const FLY_MS = 520, FLIP_MS = 420, STAGGER = 170;
function cardHTML(c, key, down, ord){
  const r = c[0]==='T' ? '10' : c[0], s = SUIT[c[1]], red = c[1]==='H'||c[1]==='D';
  return `<div class="c${red?' red':''}${down?' down':''}" data-k="${key}" data-o="${ord ?? 999}" aria-label="${down?'verdeckte Karte':r+s}">
    <div class="ci"><div class="cf">${down?'':`<span class="r">${r}</span><span class="s">${s}</span><span class="big">${s}</span>`}</div><div class="cb"></div></div></div>`;
}
function animateCards(root){
  const els = [...root.querySelectorAll('.c[data-k]')];
  const now = performance.now();
  const shoe = root.querySelector('.shoe');
  if (anim.prime && T){ for (const el of els) anim.seen.set(el.dataset.k, { t0:-1e9, delay:0, down: el.classList.contains('down') }); anim.prime = false; return; }
  const fresh = els.filter(el => !anim.seen.has(el.dataset.k)).sort((a,b)=>(+a.dataset.o)-(+b.dataset.o));
  fresh.forEach((el,i) => { anim.seen.set(el.dataset.k, { t0: now, delay: i*STAGGER, down: el.classList.contains('down'), fresh:true }); SFX.card((i*STAGGER + FLY_MS*.75)/1000); });
  if (reduceMotion) return;
  const sr = shoe?.getBoundingClientRect();
  for (const el of els){
    const a = anim.seen.get(el.dataset.k);
    const down = el.classList.contains('down');
    const elapsed = now - a.t0;
    if (a.fresh && elapsed < a.delay + FLY_MS + FLIP_MS){
      const r = el.getBoundingClientRect();
      const dx = sr ? (sr.left + sr.width/2) - (r.left + r.width/2) : 0, dy = sr ? (sr.top + sr.height/2) - (r.top + r.height/2) : -60;
      const fly = el.animate([
        { transform:`translate(${dx}px,${dy}px) rotate(-28deg) scale(.82)` },
        { transform:'translate(0,0) rotate(0) scale(1)' }
      ], { duration: FLY_MS, delay: a.delay, easing:'cubic-bezier(.18,.82,.26,1)', fill:'backwards' });
      fly.currentTime = elapsed;
      if (!down){
        const flip = el.firstElementChild.animate([
          { transform:'rotateY(180deg)' }, { transform:'rotateY(180deg)', offset:.5 }, { transform:'rotateY(0deg)' }
        ], { duration: FLY_MS + FLIP_MS*.6, delay: a.delay, easing:'ease-out', fill:'backwards' });
        flip.currentTime = elapsed;
      }
    }
    if (a.down && !down && !a.flipT0){ a.flipT0 = now; SFX.card(); }
    a.down = down;
    if (a.flipT0 && now - a.flipT0 < FLIP_MS + 60){
      const f = el.firstElementChild.animate([{ transform:'rotateY(180deg) scale(1.08)' }, { transform:'rotateY(0deg) scale(1)' }], { duration: FLIP_MS, easing:'ease-out' });
      f.currentTime = now - a.flipT0;
    }
  }
  if (anim.seen.size > 400){ const keep = new Set(els.map(e=>e.dataset.k)); for (const k of anim.seen.keys()) if (!keep.has(k)) anim.seen.delete(k); }
}

function chartHTML(hist){
  if (!hist || hist.length < 2) return '<p class="muted">Nach ein paar Runden erscheint hier der Verlauf des Kontostands.</p>';
  // draw at roughly the on-screen width so labels keep their real size
  const W = Math.round(Math.min(1000, Math.max(300, innerWidth - 80))), H = 180, pl_ = 64, pr = 12, pt = 12, pb = 22;
  const vals = hist.map(h=>h.b);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi===lo){ hi += 100; lo = Math.max(0, lo-100); }
  const pad = (hi-lo)*.08; lo = Math.max(0, lo-pad); hi += pad;
  const x = i => pl_ + i*(W-pl_-pr)/(vals.length-1), y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grid = [lo, (lo+hi)/2, hi].map(v => `<line x1="${pl_}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(209,173,98,.15)"/><text x="${pl_-8}" y="${y(v)+4}" text-anchor="end" fill="#a3b7ab" font-size="11" font-family="IBM Plex Mono, monospace">${fmt(v)}</text>`).join('');
  const last = vals.length-1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand der letzten ${vals.length} Runden">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d1ad62" stop-opacity=".35"/><stop offset="1" stop-color="#d1ad62" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polygon points="${x(0)},${H-pb} ${pts} ${x(last)},${H-pb}" fill="url(#ga)"/>
    <polyline points="${pts}" fill="none" stroke="#d1ad62" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="4.5" fill="#d1ad62" stroke="#231a14" stroke-width="2"/>
    <text x="${pl_}" y="${H-5}" fill="#a3b7ab" font-size="11">vor ${vals.length} Runden</text><text x="${W-pr}" y="${H-5}" text-anchor="end" fill="#a3b7ab" font-size="11">jetzt</text>
  </svg></div>`;
}

}

let rq = false;
function renderAll(){
  if (rq || !uid) return; rq = true;
  requestAnimationFrame(() => {
    rq=false; renderTop();
    const typing = el => { const a=document.activeElement; return a && a.tagName==='INPUT' && a.type!=='checkbox' && el.contains(a); };
    if (tab==='table' && !typing($('tv'))) renderTable();
    if (tab==='players' && !typing($('view-players'))) renderPlayers();
    if (tab==='shop') renderShop();
    if (tab==='account'){ if (typing($('view-account'))) renderAccountStats(); else renderAccount(); }
    renderModal(false);
    tickTimers();
  });
}
function tickTimers(){
  for (const el of document.querySelectorAll('[data-until]')) el.textContent = Math.max(0, Math.ceil((+el.dataset.until - Date.now())/1000));
}
function setTab(t){
  tab = t; shopConfirm = null;
  for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', b.dataset.tab===t);
  for (const v of ['table','players','shop','account']) $('view-'+v).hidden = v!==t;
  if (t==='table') { lastTableHTML = ''; anim.prime = true; }
  renderAll();
}

/* ---------- events ---------- */
async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast(label+' kopiert'); } catch { toast(label+': '+text); }
}
$('mute').addEventListener('click', () => { snd.on = !snd.on; ls.set('sound', snd.on); if (snd.on) SFX.chip(); renderTop(); });
document.addEventListener('change', e => {
  if (e.target.id==='autobet'){
    auto = e.target.checked; ls.set('autobet', auto);
    toast(auto ? `Auto-Einsatz an: ${fmt(ls.get('lastBet', bet))} ℒ jede Runde` : 'Auto-Einsatz aus');
    if (auto){ autoRound = null; afterTable(); }
    e.target.blur(); renderAll();
  }
});
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb){ setTab(tb.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a!=='leave') confirmLeave = false;
  if (a!=='shop') shopConfirm = null;
  switch (a){
    case 'create': case 'createvip': b.disabled = true; await createTable(a==='createvip'); b.disabled = false; break;
    case 'join': toast('Du setzt dich an den Tisch …'); sitAt(b.dataset.id); break;
    case 'joincode': await joinByCode($('tcode').value); break;
    case 'leave': leaveTable(); break;
    case 'copytable': copy(tid, 'Tisch-Code'); break;
    case 'copycode': copy(P.code, 'Freundescode'); break;
    case 'chip': bet = Math.min(MAX_BET, P.balance, (bet<MIN_BET?0:bet) + +b.dataset.v); SFX.chip(); renderAll(); break;
    case 'betclear': bet = 0; renderAll(); break;
    case 'betmax': bet = Math.max(0, Math.min(MAX_BET, Math.floor(P.balance/100)*100)); SFX.chip(); renderAll(); break;
    case 'bet': placeBet(bet); break;
    case 'unbet': unBet(); if (auto){ auto=false; ls.set('autobet', false); toast('Auto-Einsatz aus'); } break;
    case 'hit': case 'stand': case 'double': case 'split': case 'surrender': act(a); break;
    case 'insure': insure(true); break;
    case 'noinsure': insure(false); break;
    case 'emoji': sendMsg(b.dataset.e, 'e'); break;
    case 'fair': openModal('fair'); break;
    case 'profile': openModal('profile', b.dataset.id); break;
    case 'closemodal': closeModal(); break;
    case 'revive': {
      b.disabled = true;
      const ok = withPlayer(d => {
        if (!brokeDoc(d)) return false;               // decided on the latest state: a second tap does nothing
        d.balance = START; d.stats.bankrupts += 1; d.limits = { ...(d.limits||{}), base: START }; d.ledger = null; d.lowMark = START;
        d.streaks = { win:0, bj:0 };
        grant(d,'broke1'); if (d.stats.bankrupts >= 5) grant(d,'broke5');
        return true;
      });
      if (ok){ bet = Math.min(bet, 1000); toast('Wiederbelebt: 2.000 Legats'); }
      break;
    }
    case 'daily': {
      b.disabled = true;
      let got = 0, streak = 0;
      withPlayer(d => {
        const today = dayId(); if (d.daily.last === today) return false;
        streak = d.daily.last === dayId(Date.now()-864e5) ? d.daily.streak + 1 : 1;
        got = dailyAmount(streak); d.balance += got; d.daily = { last: today, streak };
        if (streak >= 7) grant(d,'daily7');
        return true;
      });
      if (got){ SFX.coins(); toast(`+${fmt(got)} ℒ · Tag ${streak} in Folge`); }
      break;
    }
    case 'mode': boardMode = b.dataset.v; renderAll(); break;
    case 'scope': boardScope = b.dataset.v; renderAll(); break;
    case 'addfriend': case 'befriend': {
      let hit;
      if (a==='befriend') hit = [b.dataset.id, players[b.dataset.id]];
      else {
        const code = $('fcode').value.trim().toUpperCase();
        hit = Object.entries(players).find(([id,p]) => p.code===code);
        if (!hit) return toast('Kein Spieler mit diesem Code.');
      }
      if (hit[0]===uid) return toast('Das ist dein eigener Code.');
      if (friendIds().includes(hit[0])) return toast('Ihr seid schon befreundet.');
      withPlayer(d => { d.friends = [...new Set([...(d.friends||[]), hit[0]])]; return true; });
      if ($('fcode')) $('fcode').value=''; document.activeElement?.blur(); toast('Du bist jetzt mit '+hit[1].name+' befreundet'); renderModal(true); break;
    }
    case 'gift': case 'loan': {
      const v = parseInt($('gamt')?.value, 10);
      sendGift(b.dataset.id, v, a); if ($('gamt')) $('gamt').value=''; document.activeElement?.blur(); renderModal(true); break;
    }
    case 'repay': {
      const owed = +b.dataset.v, typed = parseInt($('gamt')?.value, 10);
      const v = Math.min(owed, typed > 0 ? typed : owed, P.balance);
      sendGift(b.dataset.id, v, 'repay'); renderModal(true); break;
    }
    case 'shop': {
      const kind = b.dataset.kind, id = b.dataset.id, price = +b.dataset.price, key = kind+':'+id;
      const owned = price===0 || P.owned.includes(key);
      if (!owned){
        if (inRound()) return toast('Warte, bis deine Runde vorbei ist.');
        if (P.balance < price) return toast(`Dafür fehlen dir ${fmt(price - P.balance)} Legats.`);
        if (shopConfirm !== key){ shopConfirm = key; renderAll(); return; }
      }
      shopConfirm = null;
      const ok = withPlayer(d => {
        if (!owned){ if (d.balance < price || d.owned.includes(key)) return false; d.balance -= price; d.owned = [...d.owned, key]; }
        if (kind==='av') d.avatar = id; else d.sel = { ...d.sel, [kind]: id };
        return true;
      });
      if (ok && !owned){ SFX.coins(); toast('Gekauft und ausgewählt'); }
      break;
    }
    case 'savename': {
      const n = $('aname').value.trim().slice(0,20);
      if (!n) return toast('Bitte gib einen Namen ein.');
      withPlayer(d => { if (d.name===n) return false; d.name = n; return true; });
      document.activeElement?.blur(); toast('Name gespeichert'); renderAll(); break;
    }
    case 'savelimits': {
      const w = parseInt($('lwin').value,10), l = parseInt($('lloss').value,10);
      if ((w && w<100) || (l && l<100)) return toast('Limits ab 100 Legats, oder leer lassen.');
      withPlayer(d => { d.limits = { win: w>0?w:null, loss: l>0?l:null, base: d.limits?.base ?? d.balance }; return true; });
      document.activeElement?.blur(); toast('Limits gespeichert'); renderAll(); break;
    }
    case 'newsession':
      withPlayer(d => { d.limits = { ...(d.limits||{}), base: d.balance }; return true; });
      toast('Neue Session ab '+fmt(P.balance)+' ℒ'); renderAll(); break;
    case 'logout': await signOut(auth); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key!=='Enter') return;
  if (e.target.id==='tcode') joinByCode(e.target.value);
  if (e.target.id==='fcode') document.querySelector('[data-act="addfriend"]')?.click();
});
</script>
