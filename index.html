<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legat Casino</title>
<meta name="theme-color" content="#17110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legat Casino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single felt table under a wooden rail; tabs switch Tisch / Spieler / Shop / Konto. One dark "casino at night" look. */
:root{
  --felt:#0f3d2f; --felt-deep:#0a2a20; --rail:#17110d; --rail-2:#231a14;
  --brass:#d1ad62; --brass-dim:#8f7643; --ink:#f2ebdd; --muted:#a3b7ab;
  --card:#fbf8f1; --card-ink:#1b1b1f; --suit-red:#c4382a;
  --win:#79d8a2; --lose:#ec8a78; --push:#e7cf8f;
  --line:rgba(209,173,98,.28);
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--rail);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 70% at 50% 0%, var(--rail-2), var(--rail) 70%);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rail);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;white-space:nowrap;flex:none}
.top-in > .iconbtn{margin-left:auto}
.top.has-island .top-in > .iconbtn{margin-left:0}
.logo span{color:var(--brass)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.purse{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.purse small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.purse b{font-family:var(--f-num);font-size:19px;color:var(--brass);transition:color .3s}
.purse #peur{font-size:12px;color:var(--muted)}
.purse b.up{color:var(--win)} .purse b.down{color:var(--lose)}
nav.tabs{display:flex;gap:4px;width:100%;}
nav.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px;color:var(--muted);font-weight:600;letter-spacing:.04em}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}

.panel{background:var(--rail-2);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:500;font-size:24px;margin:0 0 4px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.btn{border:1px solid var(--brass-dim);background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;letter-spacing:.02em}
.btn:hover{border-color:var(--brass)}
.btn.gold{background:var(--brass);color:#1b140a;border-color:var(--brass)}
.btn.gold:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);min-width:0;width:100%}
.code{font-family:var(--f-num);font-size:22px;letter-spacing:.14em;color:var(--brass)}
.note{border-left:3px solid var(--brass);padding:8px 12px;background:rgba(209,173,98,.08);border-radius:0 8px 8px 0}
.note.bad{border-color:var(--lose);background:rgba(236,138,120,.08)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--rail);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;user-select:none;flex-wrap:wrap;justify-content:center}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:#3b332b;position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{transform:translateX(16px)}

/* daily bonus banner */
.daily{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(90deg,rgba(209,173,98,.22),rgba(209,173,98,.06));border:1px solid var(--brass-dim);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.daily b{color:var(--brass)}
.streak{display:flex;gap:4px}
.streak i{width:10px;height:10px;border-radius:50%;background:#3b332b;display:block}
.streak i.on{background:var(--brass)}

/* login */
.login{max-width:440px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.login h1{font-family:var(--f-display);font-size:40px;font-weight:700;margin:0;line-height:1.05}
.login h1 span{color:var(--brass)}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.gbtn svg{width:20px;height:20px}
.fan{display:flex;justify-content:center;height:110px;position:relative;width:200px}
.fan .c{position:absolute;top:10px;transform-origin:50% 120%}

/* table */
.felt{--f1:#175a45;--f2:#0f3d2f;--f3:#0a2a20;--b1:#7d2a22;--b2:#6a221c;position:relative;background:radial-gradient(110% 90% at 50% 10%, var(--f1), var(--f2) 45%, var(--f3));border-radius:28px 28px 14px 14px;border:10px solid #3a2617;box-shadow:inset 0 0 0 2px var(--brass-dim), 0 20px 40px rgba(0,0,0,.45);padding:18px 14px 20px;overflow:hidden}
.felt.vip{border-color:#5a4417;box-shadow:inset 0 0 0 2px var(--brass), 0 0 0 1px var(--brass), 0 20px 40px rgba(0,0,0,.45)}
.felt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;position:relative;z-index:1;padding-right:56px}
.tcode{font-family:var(--f-num);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tcode b{color:var(--brass);letter-spacing:.12em;font-size:15px}
.vipbadge{font-family:var(--f-display);font-weight:700;color:#1b140a;background:var(--brass);border-radius:4px;padding:1px 7px;font-size:12px;letter-spacing:.1em}
.shoe{position:absolute;right:18px;top:20px;width:46px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--b1) 0 6px,var(--b2) 6px 12px);border:3px solid var(--card);box-shadow:3px 3px 0 -1px var(--card),6px 6px 0 -2px var(--card),0 8px 14px rgba(0,0,0,.4);transform:rotate(8deg)}
.arc{font-family:var(--f-display);text-align:center;color:rgba(242,235,221,.55);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 2px;padding-inline:52px}
.arc em{font-style:normal;color:var(--brass)}
.dealer{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{min-height:24px;text-align:center;font-weight:700;color:var(--push)}
.hand{display:flex;justify-content:center}
.cards{display:flex;min-height:20px}
.cards .c + .c{margin-left:-22px}

/* a card: outer box flies, inner box flips */
.c{width:60px;height:86px;position:relative;flex:none;perspective:700px;font-family:var(--f-display);font-weight:700}
.ci{position:absolute;inset:0;transform-style:preserve-3d}
.c.down .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.cf{background:var(--card);color:var(--card-ink)}
.cb{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--b1) 0 6px,var(--b2) 6px 12px);border:3px solid var(--card)}
.c.red .cf{color:var(--suit-red)}
.cf .r{position:absolute;top:4px;left:6px;font-size:19px;line-height:1}
.cf .s{position:absolute;top:22px;left:6px;font-size:15px;line-height:1}
.cf .big{position:absolute;right:6px;bottom:2px;font-size:30px;line-height:1}
.score{font-family:var(--f-num);font-size:13px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 9px}

.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.seat{border:1px dashed rgba(242,235,221,.22);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:box-shadow .3s;position:relative}
.seat.me{border-style:solid;border-color:var(--brass)}
.seat.turn{box-shadow:0 0 0 2px var(--brass),0 0 22px rgba(209,173,98,.35)}
.seat .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-size:12px;color:var(--muted)}
.seat .c{width:44px;height:63px}
.seat .cf .r{font-size:15px}.seat .cf .s{font-size:12px;top:19px}.seat .cf .big{font-size:21px}
.seat .cards .c + .c{margin-left:-20px}
.seat.me .c{width:60px;height:86px}
.seat.me .cf .r{font-size:19px}.seat.me .cf .s{font-size:15px;top:22px}.seat.me .cf .big{font-size:30px}
.bubble{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--ink);color:var(--rail);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2;animation:bub 5s ease-out both;pointer-events:none}
.bubble.emo{font-size:26px;background:none;padding:0;top:-22px}
@keyframes bub{0%{transform:translate(-50%,8px) scale(.5);opacity:0}8%{transform:translate(-50%,0) scale(1.1);opacity:1}14%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.hands{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:8px}
.hbox.active{background:rgba(209,173,98,.14)}
.hbox.won .cards{animation:glow 1.4s ease-out 1}
@keyframes glow{0%{filter:drop-shadow(0 0 0 rgba(121,216,162,0))}40%{filter:drop-shadow(0 0 14px rgba(121,216,162,.9))}100%{filter:drop-shadow(0 0 0 rgba(121,216,162,0))}}
.chip-bet{font-family:var(--f-num);font-size:12px;color:var(--brass)}
.res{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;animation:pop .35s ease-out both}
.res.win,.res.bj{color:var(--win)} .res.lose{color:var(--lose)} .res.push,.res.surr{color:var(--push)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.net{font-size:20px;font-weight:700;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}

.controls{margin-top:14px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{width:54px;height:54px;border-radius:50%;border:4px dashed rgba(255,255,255,.75);font-family:var(--f-num);font-weight:600;font-size:12px;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);display:grid;place-items:center;transition:transform .12s}
.chip:active{transform:translateY(2px) scale(.96)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.ch50{background:#d9822b}.ch100{background:#3d6fb6}.ch500{background:#7b3fa0}.ch1k{background:#b8432f}.ch5k{background:#2f8a55}.ch10k{background:#1f1f24}.ch25k{background:#b48a2c}
.betline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.betval{font-family:var(--f-num);font-size:24px;color:var(--brass);min-width:7ch;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.acts .btn{min-width:110px}
.timer{font-family:var(--f-num);font-size:12px;color:var(--muted)}

/* chat */
.chat{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{background:var(--rail);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:20px;display:grid;place-items:center}
.emojis button:active{transform:scale(.9)}
.chatlog{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto;font-size:14px;padding-right:4px}
.chatlog .m b{color:var(--brass);margin-right:6px}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;background:var(--rail);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--ink)}

/* players */
table.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:10px 8px;border-bottom:1px solid rgba(209,173,98,.12);white-space:nowrap}
.board tbody tr{cursor:pointer}
.board tbody tr:hover td{background:rgba(209,173,98,.05)}
.board td.r,.board th.r{text-align:right}
.board tr.me td{background:rgba(209,173,98,.07)}
.scroll{overflow-x:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55625b;margin-right:7px;vertical-align:1px}
.dot.on{background:var(--win);box-shadow:0 0 6px var(--win)}
.av{display:inline-block;width:1.5em;text-align:center;margin-right:4px}
.rank{font-family:var(--f-display);color:var(--brass);font-size:17px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.bad{color:var(--lose);border-color:rgba(236,138,120,.45)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1b140a}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--f-num);font-size:18px}
.lobby-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}

/* achievements */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.badge .ic{font-size:24px;line-height:1}
.badge b{display:block;font-size:13px}
.badge span{display:block;font-size:11px;color:var(--muted)}
.badge.locked{opacity:.35;filter:grayscale(1)}
.badge.shame{border-color:rgba(236,138,120,.45)}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);text-align:center}
.item.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.item .big{font-size:34px;line-height:1.1}
.item .sw{width:70px;height:48px;border-radius:8px;border:3px solid #3a2617}
.item .bk{width:38px;height:54px;border-radius:5px;border:3px solid var(--card)}
.item small{font-size:12px;color:var(--muted)}
.item .price{font-family:var(--f-num);font-size:12px;color:var(--brass)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column;gap:2px;font-size:13px}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(209,173,98,.1)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,7,5,.72);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--rail-2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.modal{align-items:center}.modal-card{border-radius:16px}}
.prof-head{display:flex;gap:14px;align-items:center}
.prof-av{font-size:44px;line-height:1;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--rail);border:1px solid var(--line);flex:none}
.bars{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;align-items:end;height:110px}
.bars div{background:var(--brass-dim);border-radius:3px 3px 0 0;min-height:2px}
.bars div.hi{background:var(--brass)}
.barlbl{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;font-family:var(--f-num);font-size:11px;text-align:center;color:var(--muted)}

@media (max-width:520px){
  .c{width:50px;height:72px}.cf .r{font-size:16px}.cf .s{font-size:13px;top:19px}.cf .big{font-size:24px}
  .seat.me .c{width:52px;height:75px}
  .chips{gap:5px}
  .chip{width:42px;height:42px;font-size:10.5px;border-width:3px}
  .acts .btn{min-width:0;flex:1 1 40%}
  .felt{border-width:7px;padding:14px 8px 16px}
  .shoe{right:10px;top:14px;width:36px;height:50px}
  .logo{font-size:19px}
  nav.tabs button{font-size:12px;letter-spacing:0;padding-inline:1px}
}

/* ---------- v1.1: casino home ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 2px 4px}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,7vw,56px);line-height:1;margin:2px 0 0;font-weight:700;letter-spacing:.01em}
.hero h1 span{color:var(--brass);font-style:italic;font-weight:500}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wallet{display:flex;gap:10px}
.wallet>div{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px;background:var(--rail-2)}
.wallet small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wallet b{font-size:20px;color:var(--brass)}
.wallet>div+div b{color:var(--ink)}
.wheelbanner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(90deg,rgba(209,173,98,.25),rgba(209,173,98,.05));border:1px solid var(--brass-dim);border-radius:12px;padding:10px 16px;color:var(--ink)}
.wheelbanner b{color:var(--brass)}
.wheelbanner.done{background:var(--rail-2);border-color:var(--line)}
.wheelbanner.done b{color:var(--muted)}
.mini-wheel{flex:none;width:64px;height:64px;display:block}
.mini-wheel svg{width:64px;height:64px;animation:slowspin 30s linear infinite}
.wheelbanner.done .mini-wheel svg{animation:none;opacity:.6}
@keyframes slowspin{to{transform:rotate(360deg)}}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.tile{grid-column:span 2;display:flex;flex-direction:column;text-align:left;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--rail-2);color:var(--ink);overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brass-dim)}
.tile-bj{grid-column:span 3}.tile-sports{grid-column:span 3}
.tile .art{height:120px;display:grid;place-items:center;background:radial-gradient(110% 120% at 50% 0%,#175a45,#0f3d2f 55%,#0a2a20);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.tile-roulette .art{background:radial-gradient(110% 120% at 50% 0%,#5e1626,#3a0d17)}
.tile-slots .art{background:radial-gradient(110% 120% at 50% 0%,#3d2266,#261443)}
.tile-horses .art{background:linear-gradient(#5a7d3a,#3e5a26)}
.tile-sports .art{background:radial-gradient(110% 120% at 50% 0%,#143e6a,#0c2745)}
.tinfo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.tinfo b{font-family:var(--f-display);font-size:22px;font-weight:700}
.tinfo>span:first-of-type{color:var(--muted);font-size:13px}
.tinfo .pill{align-self:flex-start;margin-top:2px}
.minicards{display:flex}
.mc{width:52px;height:74px;background:var(--card);color:var(--card-ink);border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:20px;padding:4px 7px;box-shadow:0 4px 10px rgba(0,0,0,.4);transform:rotate(-8deg);display:flex;flex-direction:column;line-height:1}
.mc+.mc{transform:rotate(8deg);margin-left:-12px}
.mc.red{color:var(--suit-red)}
.mc i{font-style:normal;font-size:16px}
.miniwheel svg{width:150px;height:150px;margin-top:40px;animation:slowspin 40s linear infinite}
.minislots{display:flex;gap:6px}
.minislots span{background:var(--card);border-radius:6px;font-size:30px;width:50px;height:58px;display:grid;place-items:center;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15)}
.minihorses{display:flex;flex-direction:column;gap:2px;width:80%}
.minihorses span{font-size:24px;display:inline-block;transform:scaleX(-1);animation:trot 2.4s ease-in-out infinite alternate;width:max-content}
.minihorses span:nth-child(2){animation-delay:-.8s}.minihorses span:nth-child(3){animation-delay:-1.6s}
@keyframes trot{from{margin-left:0}to{margin-left:calc(100% - 30px)}}
.minisports{font-size:44px;display:flex;gap:18px}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.tile,.tile-bj,.tile-sports{grid-column:span 1}.tile-bj{grid-column:span 2}.tile .art{height:96px}.tinfo b{font-size:19px}}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;font-family:var(--f-num)}

/* ---------- shared game chrome ---------- */
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gamebar h2{margin:0;margin-right:auto}
.small-chips .chip{width:46px;height:46px;font-size:11px}
.chip.on{outline:3px solid var(--ink);outline-offset:2px}
.felt{min-width:0}

/* ---------- Glücksrad ---------- */
.wheelwrap{position:relative;display:grid;place-items:center}
.wheelwrap .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--brass);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.wheel{max-width:100%;height:auto}

/* ---------- Roulette ---------- */
.rtop{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:center;margin-bottom:14px}
.rwheelbox svg{width:100%;height:auto;display:block}
.rresult{display:flex;align-items:center;gap:12px;min-height:56px}
.rnum{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;font-family:var(--f-num);font-weight:600;font-size:22px;color:#fff;border:2px solid var(--brass)}
.rnum.sm{width:28px;height:28px;font-size:12px;border-width:1px}
.rnum.red{background:#b1302a}.rnum.black{background:#1b1b1f}.rnum.green{background:#1f7a4a}
.rhist{display:flex;gap:4px;flex-wrap:wrap}
.rboard{display:grid;grid-template-columns:44px repeat(12,1fr) 44px;grid-template-rows:repeat(3,44px) 36px 36px;gap:3px}
.rc{grid-column:var(--c);grid-row:var(--r);position:relative;border:1px solid rgba(242,235,221,.35);border-radius:4px;background:rgba(0,0,0,.15);color:#fff;font-family:var(--f-num);font-weight:600;font-size:14px;padding:0;min-width:0}
.rc.red{background:#b1302a}.rc.black{background:#1b1b1f}.rc.green{background:#1f7a4a}
.rc.out{font-family:var(--f-body);font-size:13px}
.rc:hover{filter:brightness(1.25)}
.rchip{position:absolute;right:2px;top:2px;min-width:22px;height:22px;padding:0 3px;border-radius:999px;background:var(--brass);color:#1b140a;font-size:10px;display:grid;place-items:center;border:2px dashed #fff;box-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
@media (max-width:640px){
  .rtop{grid-template-columns:1fr}.rwheelbox{max-width:240px;margin:0 auto}
  .rboard{grid-template-columns:repeat(3,1fr) 44px 44px;grid-template-rows:38px repeat(12,32px) 34px}
  .rc{grid-column:var(--mc);grid-row:var(--mr);font-size:13px}
  .rc.out{font-size:11px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .rc.out[data-k^="c"]{writing-mode:horizontal-tb;transform:none}
}

/* ---------- Automat ---------- */
.slotmachine{display:flex;justify-content:center;margin:6px 0 4px}
.reels{position:relative;display:flex;gap:8px;padding:14px;background:linear-gradient(#2a1f17,#120c08);border:4px solid var(--brass);border-radius:16px;box-shadow:inset 0 0 0 2px #000,0 14px 30px rgba(0,0,0,.5)}
.reel{width:min(26vw,104px);height:min(66vw,240px);overflow:hidden;background:linear-gradient(#cfcac0,#fbf8f1 30%,#fbf8f1 70%,#cfcac0);border-radius:8px;position:relative}
.strip{will-change:transform}
.sym{height:min(22vw,80px);display:grid;place-items:center;font-size:min(12vw,46px)}
.payline{position:absolute;left:6px;right:6px;top:50%;height:2px;background:rgba(196,56,42,.8);transform:translateY(-1px);pointer-events:none}
.spinbtn{font-size:18px;padding:12px 34px}
.paytable{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:14px}
.pt{display:flex;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);border-radius:8px;padding:6px 10px;font-size:14px}
.pt b{color:var(--brass)}

/* ---------- Pferderennen ---------- */
.racecourse{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 8px;background:linear-gradient(#7a5a35,#5e4427);border-radius:10px;border:2px solid #3a2617}
.finish{position:absolute;top:0;bottom:0;right:34px;width:6px;background:repeating-linear-gradient(#fff 0 6px,#111 6px 12px);opacity:.85}
.lane{display:flex;align-items:center;gap:6px;border-bottom:1px dashed rgba(255,255,255,.18);padding-bottom:3px}
.lnum{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:600;font-size:12px}
.track{position:relative;flex:1;height:32px}
.horse{position:absolute;top:0;left:calc(var(--x) * (100% - 40px));font-size:28px;line-height:32px;transform:scaleX(-1)}
.hpicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
.hpick{display:flex;align-items:center;gap:8px;border:1px solid rgba(242,235,221,.3);border-radius:10px;padding:8px 10px;background:rgba(0,0,0,.18);color:var(--ink);text-align:left}
.hpick.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass);background:rgba(209,173,98,.15)}
.hpick b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpick .odds{color:var(--brass)}
.hpick .place{font-family:var(--f-display);font-weight:700}

/* ---------- Sportwetten ---------- */
.segwrap{flex-wrap:wrap;border-radius:12px;display:flex}
.grid-sports{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid-sports{grid-template-columns:1fr}}
.dayh{margin:10px 0 2px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta odds" "teams odds";gap:2px 10px;padding:8px 0;border-bottom:1px solid rgba(209,173,98,.12);align-items:center}
.mmeta{grid-area:meta;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mmeta .lg.fict{color:var(--brass)}
.pill.live{color:#fff;background:#b1302a;border-color:#b1302a}
.pill.good{color:var(--win);border-color:rgba(121,216,162,.45)}
.teams{grid-area:teams;display:flex;flex-direction:column;gap:1px;min-width:0;font-weight:600}
.teams>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.teams img{width:18px;height:18px;object-fit:contain}
.score2{color:var(--brass)}
.odds{grid-area:odds;display:flex;gap:5px}
.oddbtn{display:flex;flex-direction:column;align-items:center;min-width:54px;padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--rail);color:var(--ink)}
.oddbtn small{font-size:10px;color:var(--muted)}
.oddbtn b{color:var(--brass);font-size:14px}
.oddbtn.on{background:var(--brass);border-color:var(--brass)}
.oddbtn.on b,.oddbtn.on small{color:#1b140a}
.oddbtn:disabled{opacity:.35}
.mybet{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(209,173,98,.12);font-size:14px}
.slip{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:4;background:var(--rail-2);border:1px solid var(--brass);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:up .2s ease-out both}
.news li{margin:4px 0}


/* ---------- v1.2: Automat ---------- */
.sym.hit{background:radial-gradient(circle,rgba(209,173,98,.55),rgba(209,173,98,0) 70%);animation:hitglow .7s ease-in-out infinite alternate}
@keyframes hitglow{from{transform:scale(1)}to{transform:scale(1.16)}}
.anysym{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-left:3px;border:1px dashed var(--muted);border-radius:4px;font-style:normal;font-size:.8em;color:var(--muted);vertical-align:middle}
.autorow{justify-content:center;gap:6px}
.slotrule{margin-top:10px;text-align:center;max-width:70ch;margin-inline:auto}

/* ---------- v1.2: Tellerwäscher ---------- */
.dishhud{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.dishhud b{color:var(--brass);font-size:18px}
.dishbar{height:6px;border-radius:999px;background:#3b332b;overflow:hidden}
.dishbar i{display:block;height:100%;width:100%;background:var(--brass);transition:width .1s linear}
.sink{position:relative;height:min(52vh,340px);border-radius:14px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 6px,transparent 7px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.3) 0 9px,transparent 10px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.25) 0 5px,transparent 6px),linear-gradient(#a9cbd6,#6c93a3);
  border:6px solid #8d969b;box-shadow:inset 0 6px 18px rgba(0,0,0,.35)}
.sinkintro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(23,17,13,.78)}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .rch{font-style:normal;font-size:26px}
.pl{display:inline-block;width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 38%,#8a6a3a 0 9%,transparent 10%),radial-gradient(circle at 62% 60%,#7a8a3a 0 7%,transparent 8%),radial-gradient(circle at 55% 30%,#9a5a2a 0 5%,transparent 6%),
    radial-gradient(circle,#ffffff 0 50%,#e6e0d4 51% 60%,#ffffff 61% 68%,#d9d2c4 69%);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.pl.gold{background:radial-gradient(circle at 40% 35%,#fff6c8 0 12%,transparent 13%),radial-gradient(circle,#f3cf64 0 50%,#c99a35 51% 60%,#f7dc84 61% 68%,#a77b1f 69%);box-shadow:0 0 14px #ffd76a,0 3px 6px rgba(0,0,0,.35)}
.plate{position:absolute;transform:translate(-50%,-50%);width:68px;height:68px;border:0;padding:0;cursor:pointer;animation:platein .18s ease-out both,plateout var(--life) linear both}
.plate.pl{width:70px;height:70px}
.plate.roach{background:none;font-size:44px;line-height:68px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.plate.clean{animation:clean .4s ease-out forwards}
.plate.squash{animation:squash .4s ease-out forwards}
@keyframes platein{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
@keyframes plateout{0%,80%{opacity:1}100%{opacity:.35}}
@keyframes clean{to{transform:translate(-50%,-80%) scale(1.3) rotate(25deg);opacity:0}}
@keyframes squash{to{transform:translate(-50%,-50%) scale(1.4,.3);opacity:0}}
.dishpop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;animation:dishpop .45s ease-out both}
@keyframes dishpop{to{transform:translate(-50%,-160%);opacity:0}}
.dishpop.bad{color:#ffb3a6}
.dishresult{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.dishresult .big{font-size:54px}

/* ---------- v1.3: picture avatars ---------- */
.avimg{height:1em;width:auto;vertical-align:-.12em;display:inline-block}
.prof-av .avimg{height:1em}
.item .big .avimg{height:1em}
.bubble.emo .avimg{height:1.1em}
nav.tabs button{position:relative}
.tabbadge{position:absolute;top:2px;right:calc(50% - 30px);display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#b1302a;color:#fff;font-size:10px;font-weight:700;line-height:1}
.pill.warn{color:#f3c46b;border-color:rgba(243,196,107,.5);cursor:help}
.linkbtn{background:none;border:0;color:var(--brass);text-decoration:underline;padding:0;font-size:12px}

/* ---------- Höher oder Tiefer ---------- */
.hlfelt{display:flex;flex-direction:column;gap:10px}
.hlhist{min-height:63px;justify-content:center;align-items:center;flex-wrap:nowrap;overflow:hidden}
.hlhist .c{width:44px;height:63px}
.hlhist .cf .r{font-size:15px}.hlhist .cf .s{font-size:12px;top:19px}.hlhist .cf .big{font-size:21px}
.hlhist.cards .c + .c{margin-left:-14px}
.hlmain{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap}
.hlcard .c{width:120px;height:172px}
.hlcard .cf{border-radius:12px}.hlcard .cb{border-radius:12px}
.hlcard .cf .r{font-size:38px;top:8px;left:12px}.hlcard .cf .s{font-size:30px;top:48px;left:12px}.hlcard .cf .big{font-size:64px;right:12px;bottom:6px}
.hlinfo{display:flex;flex-direction:column;gap:2px;min-width:150px}
.hlinfo small{color:var(--muted);font-size:12px}
.hlmult{font-size:40px;color:var(--brass);line-height:1.1}
.hlacts .btn{display:flex;flex-direction:column;align-items:center;min-width:140px;padding:10px 18px;line-height:1.2}
.hlacts .btn .num{font-size:15px}
.hlacts .btn small{font-size:11px;font-weight:600;opacity:.75}
.tile-hilo{grid-column:span 6;flex-direction:row}
.tile-hilo .art{height:auto;width:42%;min-height:110px;background:radial-gradient(110% 120% at 50% 0%,#6e541a,#45340f);border-bottom:0;border-right:1px solid var(--line)}
.tile-hilo .tinfo{justify-content:center}
.minihl{display:flex;align-items:center;gap:10px;font-size:26px;color:#f3dc9a;font-weight:700}
.minihl .mc{transform:none}
.newtag{display:inline-block;margin-left:8px;font:700 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--brass);color:#1b140a;border-radius:4px;padding:3px 6px;vertical-align:4px}
@media (max-width:760px){.tile-hilo{grid-column:span 2}}

/* ---------- Chat ---------- */
.chatapp{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;height:calc(100vh - 190px);min-height:460px}
.chatside{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.chatmain{display:flex;flex-direction:column;gap:8px;min-height:0;padding:12px}
.chatempty{margin:auto;text-align:center}.chatempty .big{font-size:48px}
.chitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px;color:var(--ink)}
.chitem:hover{background:rgba(209,173,98,.06)}
.chitem.on{border-color:var(--brass-dim);background:rgba(209,173,98,.1)}
.chitem.unread b{color:var(--brass)}
.chav{flex:none;width:40px;height:40px;border-radius:50%;background:var(--rail);border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
.chtx{flex:1;min-width:0;display:flex;flex-direction:column}
.chtx b,.chtx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--muted)}
.udot{width:10px;height:10px;border-radius:50%;background:#b1302a;display:block}
.chk{color:var(--brass);font-weight:700}
.chathead{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.chback{display:none}
.chmore{position:relative}
.chmore summary{list-style:none;cursor:pointer}
.chmore summary::-webkit-details-marker{display:none}
.chmenu{position:absolute;right:0;top:110%;z-index:5;background:var(--rail-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chatmsgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:4px 2px}
.mrow{display:flex}
.mrow.mine{justify-content:flex-end}
.bub{max-width:78%;background:var(--rail);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px 5px;overflow-wrap:anywhere;font-size:15px}
.mrow.mine .bub{background:var(--brass);color:#1b140a;border-color:var(--brass);border-radius:14px 14px 4px 14px}
.bub.emo{font-size:34px;background:none;border-color:transparent;padding:0 4px}
.mrow.mine .bub.emo{background:none;color:inherit}
.bub .who{display:block;font-size:12px;font-weight:700;color:var(--brass);margin-bottom:1px}
.bub time{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:1px;font-family:var(--f-num)}
.bub.emo time{font-size:10px}
.msys{align-self:center;font-size:12px;color:var(--muted);background:rgba(0,0,0,.2);border-radius:999px;padding:3px 10px;margin:4px 0}
.chatemo button{width:36px;height:36px;font-size:18px}
@media (max-width:760px){
  .chatapp{grid-template-columns:1fr;height:calc(100vh - 170px)}
  .chatapp .chatmain{display:none}
  .chatapp.opened .chatside{display:none}
  .chatapp.opened .chatmain{display:flex}
  .chback{display:inline-block}
}

/* ---------- Coin Flip ---------- */

.cface{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;font-family:var(--f-display);font-weight:700;color:#5a4417;
  background:radial-gradient(circle at 35% 30%,#fff2c2,#e5c070 40%,#b8913f 75%,#8a6a28);box-shadow:inset 0 0 0 6px #c99a35,inset 0 0 0 9px #f3dc9a,0 10px 24px rgba(0,0,0,.5);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cface small{font:700 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.cz{transform:rotateY(180deg)}


/* ---------- v1.3.1: Dynamic Island ---------- */
.logo .mono{display:none}
.island{flex:0 1 auto;min-width:0;max-width:min(360px,48vw);margin:0 auto;height:34px;padding:0 6px 0 12px;border-radius:999px;background:#000;border:1px solid #2b2420;color:#fff;
  display:flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.55);overflow:hidden;animation:islin .35s cubic-bezier(.2,1.4,.4,1) both}

.islide{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.islide.in{animation:islswap .35s ease-out both}

.idot{flex:none;width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 0 rgba(255,59,48,.7);animation:livepulse 1.4s infinite}

.iteam{overflow:hidden;text-overflow:ellipsis;max-width:9ch}
.island b{color:#fff;font-size:14px}
.imin{color:#ffcf6b;font-size:12px}
.imore{flex:none;font-size:11px;color:#bbb;background:#1c1c1c;border-radius:999px;padding:3px 7px;margin-left:2px}
.ilg{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.islandpanel{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:#0b0908;border:1px solid #2b2420;border-radius:22px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.7);animation:up .2s ease-out both;display:flex;flex-direction:column;gap:4px}
.iphead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 6px}
.iprow{display:flex;align-items:center;gap:8px;width:100%;background:#151210;border:1px solid #241e1a;border-radius:14px;padding:10px 12px;color:#fff;text-align:left}

/* ---------- v1.3.1: sports overview ---------- */
.sviews{width:100%;display:flex}

.mtop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;flex-wrap:wrap}

.mlg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.mteam{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.mteam>span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mteam img{width:18px;height:18px;object-fit:contain}

.mbar{display:block;height:3px;border-radius:999px;background:#3b332b;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:#ff3b30}
.mbar.big{height:5px;margin-top:10px}
.mgo{align-self:center;color:var(--muted);font-size:22px;padding:0 6px}
.mcard .odds{align-self:center}
.pill.live{color:#fff;background:#b1302a;border-color:#b1302a}
.pill.big{font-size:13px;padding:4px 10px}
.betcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--rail-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}

@media (max-width:520px){ .mcard{flex-direction:column;padding:6px} .mcard .odds{align-self:stretch} .mcard .odds .oddbtn{flex:1} .mgo{display:none} }

/* ---------- v1.3.1: live ticker ---------- */
.scoreboard{background:radial-gradient(120% 100% at 50% 0%,#175a45,#0f3d2f 55%,#0a2a20);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.scoreboard.islive{border-color:rgba(255,59,48,.5);box-shadow:0 0 0 1px rgba(255,59,48,.25)}
.sbtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sbmain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sbteam{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.sbteam img{width:44px;height:44px;object-fit:contain}
.sbteam b{font-size:15px;overflow-wrap:anywhere}
.sbab{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line);font:700 14px var(--f-num);color:var(--brass)}

.tk.hl{background:rgba(209,173,98,.07);border-radius:8px}
.tkmin{color:var(--muted);text-align:right}
.tkic{text-align:center}
.tktx{min-width:0;overflow-wrap:anywhere}
.tk b{color:var(--brass)}


/* ---------- v1.4: Level und Tagesaufgaben ---------- */
.lvl{display:inline-block;font:700 10px/1 var(--f-num);color:#1b140a;background:var(--brass);border-radius:4px;padding:3px 5px;vertical-align:2px;letter-spacing:.02em}
.progcard{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:start}
.lvrow{display:flex;gap:12px;align-items:center}
.lvbadge{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#1b140a;background:radial-gradient(circle at 35% 30%,#f3dc9a,var(--brass) 55%,#8f6c1f);box-shadow:0 0 0 3px rgba(209,173,98,.25)}
.lvinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.lvinfo b{font-family:var(--f-display);font-size:19px;color:var(--brass)}
.xpbar,.tbar{height:7px;border-radius:999px;background:#2a231d;overflow:hidden}
.xpbar i,.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));border-radius:inherit;transition:width .5s}
.tasks{display:flex;flex-direction:column;gap:7px;min-width:0}
.tasks h3{margin:0}
.task{display:flex;align-items:center;gap:10px;background:var(--rail-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.task .tinf{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.task .tbar{height:5px}
.task.ready{border-color:var(--brass-dim);background:rgba(209,173,98,.08)}
.task.got{opacity:.65}
.task.got .tbar i{background:var(--win)}
@media (max-width:760px){.progcard{grid-template-columns:1fr}}

/* ---------- v1.4: neue Kacheln ---------- */
.tile-crash .art{background:radial-gradient(110% 120% at 30% 100%,#3a1730,#120a1c 70%)}
.tile-mines .art{background:radial-gradient(110% 120% at 50% 0%,#1f4f5e,#0c2830)}
.tile-tipp .art{background:linear-gradient(160deg,#c1272d 0 33%,#1a1a1a 33% 66%,#d9a400 66%)}
.minicrash{position:relative;width:130px;height:80px}
.minicrash svg{position:absolute;inset:0;width:100%;height:100%}
.minicrash span{position:absolute;right:4px;top:-2px;font-size:26px;transform:rotate(10deg)}

.minitipp b{font-size:30px;line-height:1}
.minitipp small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ddd}
.pill.jp{color:#1b140a;background:var(--brass);border-color:var(--brass)}

/* ---------- v1.4: Jackpot ---------- */
.jpbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;text-align:center;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(60,30,90,.55),rgba(0,0,0,.45));border:1px solid var(--brass-dim);border-radius:12px;padding:8px 14px;margin:10px auto 0;max-width:560px}
.jpbar small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jpbar b{font-size:26px;color:var(--brass);text-shadow:0 0 14px rgba(209,173,98,.5)}
.jpbar>span{flex:1 1 220px}
.jpwin{color:var(--brass);font-weight:800;font-size:22px;animation:jpglow 1s ease-in-out infinite alternate}
@keyframes jpglow{to{text-shadow:0 0 18px rgba(255,214,120,.9)}}

/* ---------- v1.4: Crash ---------- */
.crfelt{display:flex;flex-direction:column;gap:12px;background:radial-gradient(120% 90% at 50% 100%,#2a1430,#120a1c 60%,#07050c)}
.crhist{display:flex;gap:6px;overflow:hidden;flex-wrap:nowrap;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.crh{flex:none;font:600 12px/1 var(--f-num);padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.07)}
.crh.lo{color:#ff8a7a}.crh.mid{color:var(--ink)}.crh.hi{color:#1b140a;background:var(--brass)}
.crstage{position:relative;height:clamp(190px,38vw,280px);border-radius:14px;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/100% 25%,rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.crstage svg{position:absolute;inset:0;width:100%;height:100%}
.crpath{fill:none;stroke:#ff5a4f;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.crfill{fill:rgba(255,90,79,.14)}
.crstage.boom .crpath{stroke:#7a3b36}
.crstage.boom .crfill{fill:rgba(120,60,55,.12)}
.crrocket{position:absolute;font-size:30px;line-height:1;pointer-events:none;will-change:left,top,transform}
.crcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.crmult{font-size:clamp(40px,10vw,64px);color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6)}

.crcash{animation:crpulse 1s ease-in-out infinite alternate}

.crplayers{display:flex;flex-direction:column;gap:4px}
.crp{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:rgba(0,0,0,.28);border-radius:8px;padding:7px 10px;font-size:14px}

.mnfelt{display:flex;flex-direction:column;gap:10px}

/* ---------- writes (Firestore keeps the order of one client's writes; the UI never waits on them) ---------- */
function slow(pr){
  const t = setTimeout(() => toast('Firebase antwortet nicht. Prüfe deine Internetverbindung oder schalte Werbeblocker für diese Seite aus.'), 8000);
  return pr.finally(() => clearTimeout(t));
}
function handleWriteErr(e){
  console.warn(e);
  if (e?.code==='permission-denied') toast('Keine Berechtigung. Sind die neuen Sicherheitsregeln in Firebase eingetragen?');
  else if (e?.code==='resource-exhausted') toast('Das kostenlose Tageslimit von Firebase ist erreicht.');
  else toast('Speichern fehlgeschlagen, bitte nochmal versuchen.');
}
function norm(d){
  d.stats ||= { hands:0, wins:0, losses:0, pushes:0, bj:0, bankrupts:0, net:0, best:0 };
  d.friends ||= []; d.limits ||= { win:null, loss:null, base:d.balance };
  d.avatar ||= '🙂'; d.owned ||= []; d.sel ||= { felt:'green', back:'red' };
  d.daily ||= { last:null, streak:0 }; d.hist ||= []; d.ach ||= {}; d.streaks ||= { win:0, bj:0 };
  d.bets ||= [];
  if (d.euro == null) d.euro = START_EURO; d.bank ||= { last:null, got:0 };
  d.claimed ||= []; d.giftedTotal ||= 0; if (d.lowMark == null) d.lowMark = d.balance;
  d.fdone ||= [];
  if (!d.log) d.log = [{ t: Date.now(), b: 0, e: 0, r: 'start', B: d.balance, E: d.euro ?? START_EURO }];
  if (!d.week || d.week.id !== weekId()) d.week = { id: weekId(), net:0, hands:0, best:0 };
  return d;
}
let newBadges = [];
/** Change my player doc. fn(draft) returns true if it changed something. Returns whether it applied. */
let WHY = null;
function withPlayer(fn, why){
  if (!P) return false;
  const d = norm(structuredClone(P));
  newBadges = []; WHY = null; WHY_EXTRA = ''; lvlUps.length = 0;
  if (!fn(d)) return false;
  const reason = (WHY || why || '?') + WHY_EXTRA; WHY = null; WHY_EXTRA = '';
  const db_ = d.balance - P.balance, de_ = d.euro - (P.euro ?? START_EURO);
  if (db_ || de_) d.log = [...d.log, { t: Date.now(), b: db_, e: de_, r: reason, B: d.balance, E: d.euro }].slice(-150);
  checkBalanceBadges(d);
  if (brokeDoc(d)){ if (!d.brokeAt) d.brokeAt = Date.now(); } else if (d.brokeAt) d.brokeAt = null;
  d.updated = Math.max(Date.now(), (P.updated||0) + 1); d.seen = Date.now();
  P = d; renderAll();
  slow(setDoc(doc(fs,'players',uid), d)).catch(handleWriteErr);
  if (newBadges.length){ const b = newBadges; newBadges = []; b.forEach((k,i) => badgeLater(k, 400 + i*2200)); }
  if (lvlUps.length){ const ups = lvlUps.splice(0); ups.forEach((L,i) => levelLater(L, 900 + i*2600)); }
  return true;
}
/** achievement toasts wait until a spin or race has finished, so they never give the result away */
function badgeLater(k, ms){
  setTimeout(() => {
    if (hold || R.busy || S.busy || H.busy || wheelBusy) return badgeLater(k, 300);
    const a = ACH.find(x=>x[0]===k); SFX.badge(); toast(`${a[1]} Erfolg freigeschaltet: ${a[2]}`);

}
function seatWrite(data, mode='update'){
  const ref = doc(fs,'seats',uid);
  if (mode!=='delete' && tid){ seats = { ...seats, [uid]: mode==='set' ? data : { ...(seats[uid]||{}), ...data } }; renderAll(); }

function genCode(len, alpha='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'){ let s=''; for(let i=0;i<len;i++) s+=alpha[rnd(alpha.length)]; return s; }

function friendIds(){
  if (!P) return [];
  const s = new Set(P.friends||[]);
  for (const [id,p] of Object.entries(players)) if ((p.friends||[]).includes(uid)) s.add(id);
  s.delete(uid);
  return [...s].filter(id => players[id]);
}
const isFriend = id => friendIds().includes(id);
function limitState(){
  const L = P?.limits; if (!L || (!L.win && !L.loss)) return null;
  const profit = P.balance - L.base;
  if (L.win && profit >= L.win) return {hit:'win', profit};
  if (L.loss && -profit >= L.loss) return {hit:'loss', profit};
  return {hit:null, profit};
}

const euroOf = p => p?.euro ?? START_EURO;
const wealth = p => (p?.balance || 0) + euroOf(p);

const brokeDoc = d => d && d.balance + euroOf(d) < MIN_BET && !ledgerOpen(d);

function grant(d, key){ if (!d.ach[key]){ d.ach[key] = Date.now(); newBadges.push(key); } }
function checkBalanceBadges(d){
  const w = d.balance + d.euro;
  if (w >= 10000) grant(d,'k10');
  if (w >= 100000) grant(d,'k100');
  if (w >= 1000000) grant(d,'m1');
  if (w >= 10000 && d.lowMark <= 200) grant(d,'comeback');
}
function feltStyle(ownerId){

/** debts[debtor][creditor] = amount still owed */
function debts(){
  const m = {};
  const add = (a,b,v) => { (m[a] ||= {}); m[a][b] = (m[a][b]||0) + v; };
  for (const g of Object.values(gifts)){
    if (g.kind==='loan') add(g.to, g.from, g.amount);
    if (g.kind==='repay') add(g.from, g.to, -g.amount);
  }
  for (const a in m) for (const b in m[a]) if (m[a][b] <= 0) delete m[a][b];
  return m;
}

function accrueInterest(){
  if (!P) return; const today = dayId(); let got = 0;
  withPlayer(d => { WHY = 'Zinsen';
    if (d.bank.last === today) return false;
    if (d.bank.last){ got = Math.min(INT_MAX, Math.floor(d.euro * INT_RATE)); d.euro += got; }
    d.bank = { last: today, got };
    return true;
  });
  if (got){ SFX.coins(); toast(`Zinsen von der Bank: +${fmt(got)} €`); }
}
function bankMove(kind, v){
  v = Math.floor(v);
  if (kind==='deposit'){
    if (!(v >= 100)) return toast('Mindestens 100 Legats einzahlen.');
    if (inRound()) return toast('Einzahlen geht erst, wenn deine Runde vorbei ist.');
    if (v > P.balance) return toast('So viele Legats hast du nicht.');
    const fee = Math.ceil(v * BANK_FEE);
    const ok = withPlayer(d => { WHY = 'Bank: Einzahlung';
      if (ledgerOpen(d) || d.balance < v) return false;
      d.balance -= v; d.euro += v - fee;
      d.limits = { ...d.limits, base: (d.limits.base ?? d.balance + v) - v };   // moving money is not a win or loss
      return true;
    });
    if (ok){ SFX.coins(); toast(`${fmt(v - fee)} € eingezahlt (Gebühr ${fmt(fee)})`); }
    return ok;
  }
  if (!(v >= 50)) return toast('Mindestens 50 € abheben.');
  if (v > P.euro) return toast('So viel liegt nicht auf der Bank.');
  const ok = withPlayer(d => { WHY = 'Bank: Abhebung';
    if (d.euro < v) return false;
    d.euro -= v; d.balance += v;
    d.limits = { ...d.limits, base: (d.limits.base ?? d.balance - v) + v };
    return true;
  });
  if (ok){ SFX.chip(); toast(`${fmt(v)} Legats abgehoben`); }
  return ok;
}

/* ---------- gifts & loans ---------- */
function claimGifts(){
  if (!P) return;
  for (const [id, g] of Object.entries(gifts)){
    if (g.to !== uid || g.claimed) continue;
    const did = withPlayer(d => { WHY = ({gift:'Geschenk erhalten',loan:'Geliehen bekommen',repay:'Rückzahlung erhalten',ref:'Einladungsbonus'})[g.kind] || 'Geschenk erhalten'; if (d.claimed.includes(id)) return false; d.balance += g.amount; d.claimed = [...d.claimed, id].slice(-300); return true; });
    if (did){
      SFX.coins();
      if (g.kind==='ref') toast(`${nameOf(g.from)} ist über deinen Link beigetreten: +${fmt(g.amount)} ℒ`); else
      toast(g.kind==='loan' ? `${nameOf(g.from)} leiht dir ${fmt(g.amount)} ℒ` : g.kind==='repay' ? `${nameOf(g.from)} zahlt dir ${fmt(g.amount)} ℒ zurück` : `${nameOf(g.from)} schenkt dir ${fmt(g.amount)} ℒ`);
    }
    if (P.claimed.includes(id)) updateDoc(doc(fs,'gifts',id), { claimed:true }).catch(()=>{});
  }
}
function sendGift(to, amount, kind){
  amount = Math.floor(amount);
  if (!(amount >= 100)) return toast('Mindestens 100 Legats.');
  if (inRound()) return toast('Warte, bis deine Runde vorbei ist.');
  if (amount > P.balance) return toast('So viele Legats hast du nicht.');
  const ref = doc(collection(fs,'gifts'));
  const ok = withPlayer(d => { WHY = ({gift:'Geschenk',loan:'Verliehen',repay:'Schulden zurückgezahlt'})[kind] || 'Geschenk';
    if (d.balance < amount || ledgerOpen(d)) return false;
    d.balance -= amount;
    if (kind==='gift'){ d.giftedTotal += amount; if (d.giftedTotal >= 10000) grant(d,'generous'); }
    return true;
  });
  if (!ok) return;
  slow(setDoc(ref, { from:uid, to, amount, kind, claimed:false, t:Date.now() })).catch(handleWriteErr);
  SFX.coins();
  toast(kind==='loan' ? `Du leihst ${nameOf(to)} ${fmt(amount)} ℒ` : kind==='repay' ? `Du zahlst ${nameOf(to)} ${fmt(amount)} ℒ zurück` : `Du schenkst ${nameOf(to)} ${fmt(amount)} ℒ`);
}

function openTable(id){
  if (tid === id) return;
  closeTable(); game = 'bj'; setTimeout(() => setPlaying('bj'), 0);
  tid = id; T = null; seats = {}; msgs = []; anim.prime = true; seatHealed = false; autoRound = null;
  setTimeout(leaseLoop, 300);
  unsubT = onSnapshot(doc(fs,'tables',id), s => {
    if (!s.exists()){ if (!s.metadata.fromCache && tid===id){ T=null; renderAll(); } return; }
    T = s.data(); pendingAct = false; reconcile(); afterTable(); renderAll();
  }, e => console.warn(e));
  unsubS = onSnapshot(query(collection(fs,'seats'), where('table','==',id)), s => {
    const n = {}; s.docs.forEach(d => n[d.id] = d.data()); seats = n;
    if (!n[uid] && !s.metadata.fromCache && !s.metadata.hasPendingWrites && !leaving && !seatHealed && tid===id){
      seatHealed = true; seatWrite({ table:id, joined:Date.now(), ready:false, round:-1, bet:0, act:null }, 'set');
    }
    afterTable(); renderAll();
  }, e => console.warn(e));
  let first = true;
  unsubM = onSnapshot(query(collection(fs,'tables',id,'msgs'), orderBy('t','desc'), limit(40)), s => {
    msgs = s.docs.map(d => d.data()).reverse();
    if (!first) for (const ch of s.docChanges()) if (ch.type==='added' && ch.doc.data().u !== uid){
      const m = ch.doc.data(); bubbles[m.u] = { x:m.x, k:m.k, at:Date.now() };
      SFX.pop(); setTimeout(renderAll, 5100);
    }
    first = false; renderChat(); renderAll();
  }, e => console.warn(e));
}
function closeTable(){

}
async function createTable(vip){
  if (vip && P.balance < VIP_MIN) return toast(`Für einen VIP-Tisch brauchst du mindestens ${fmt(VIP_MIN)} Legats.`);
  let id;
  for (let i=0;i<5;i++){ id = genCode(5); const s = await getDoc(doc(fs,'tables',id)); if (!s.exists()) break; }
  const t = { name: (P?.name||'Spieler')+'s Tisch', owner: uid, min: vip ? VIP_MIN : MIN_BET, phase:'betting', round:1, shoe:[], dealer:[], hands:{}, order:[],
    turn:null, history:{}, acts:{}, reveal:false, betUntil:null, created:Date.now() };
  reshuffle(t);
  try { await slow(setDoc(doc(fs,'tables',id), t)); } catch(e){ return handleWriteErr(e); }
  sitAt(id);
}
async function joinByCode(code){
  code = (code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length !== 5) return toast('Ein Tisch-Code hat 5 Zeichen.');
  const s = await getDoc(doc(fs,'tables',code));
  if (!s.exists()) return toast('Kein Tisch mit diesem Code gefunden.');
  const c = await getDocs(query(collection(fs,'seats'), where('table','==',code)));
  const active = c.docs.filter(d => d.id!==uid && isOnline(d.id) && players[d.id]?.table===code).length;
  if (active >= MAX_SEATS) return toast('Der Tisch ist voll (5 Plätze).');
  sitAt(code);
}
function sitAt(id){
  if (!id) return;
  seatWrite({ table:id, joined:Date.now(), ready:false, round:-1, bet:0, act:null }, 'set');
  withPlayer(d => { if (d.table===id) return false; d.table = id; return true; });
  openTable(id); setTab('table');
}
function leaveTable(){
  const mid = T && T.hands && T.hands[uid] && T.phase!=='betting' && T.phase!=='done';
  if (mid && !confirmLeave){ confirmLeave = true; renderAll(); return; }
  confirmLeave = false; leaving = true;
  seatWrite(null,'delete');
  withPlayer(d => {
    d.table = null;
    // a hand you walk away from is lost; close it so bank and revive don't stay locked
    if (d.ledger && !d.ledger.settled){
      const c = d.ledger.committed || 0;
      d.stats.hands += 1; d.stats.losses += 1; d.stats.net -= c; d.week.net -= c; d.streaks.win = 0; d.streaks.bj = 0;
      d.hist = [...d.hist, { t:Date.now(), b:d.balance + d.euro, n:-c, w:c }].slice(-60);
      d.ledger = { ...d.ledger, settled:true };
    }
    return true;
  });
  closeTable(); renderAll();
  setTimeout(() => { leaving = false; }, 3000);
}

/* ---------- player actions ---------- */
function canBet(amount){
  const lim = limitState();
  if (lim?.hit) return lim.hit==='win' ? 'Gewinnziel erreicht. Starte im Konto eine neue Session.' : 'Stop-Loss erreicht. Starte im Konto eine neue Session.';
  if (amount < tableMin()) return `Mindesteinsatz an diesem Tisch: ${fmt(tableMin())} Legats.`;
  if (amount > MAX_BET) return 'Höchsteinsatz: 50.000 Legats.';
  if (amount > P.balance) return 'Nicht genug Legats.';
  return null;
}
function placeBet(amount = bet){
  if (!T || T.phase!=='betting') return false;
  const err = canBet(amount); if (err){ toast(err); return false; }
  ls.set('lastBet', amount); bet = amount;
  seatWrite({ ready:true, round:T.round, bet:amount });
  SFX.chip();
  return true;
}
function unBet(){ seatWrite({ ready:false }); }
function act(type){
  if (!T || T.phase!=='playing' || !T.turn || T.turn.u!==uid || pendingAct) return;
  const H = T.hands[uid][T.turn.h];
  if ((type==='double' || type==='split') && P.balance < H.bet) return toast('Nicht genug Legats für '+(type==='double'?'Verdoppeln':'Teilen')+'.');
  pendingAct = true; renderAll();
  seatWrite({ act: { type, h:T.turn.h, round:T.round, seq:Date.now() } });
  setTimeout(()=>{ if(pendingAct){ pendingAct=false; renderAll(); } }, 4000);
}
function insure(yes){
  if (!T || T.phase!=='insurance' || !T.hands?.[uid] || T.insDone?.[uid] || pendingAct) return;
  const cost = Math.floor(T.hands[uid][0].bet/2);
  if (yes && P.balance < cost) return toast('Nicht genug Legats für die Versicherung.');
  pendingAct = true; renderAll();
  seatWrite({ act: { type: yes ? 'insure' : 'noinsure', h:-1, round:T.round, seq:Date.now() } });
  setTimeout(()=>{ if(pendingAct){ pendingAct=false; renderAll(); } }, 4000);
}
/** runs after every table update: auto bet, sounds */
let lastTurnKey = null, lastDoneKey = null;
function afterTable(){
  if (!T || !P) return;
  // auto bet: repeat the last bet at the start of every round
  if (auto && T.phase==='betting' && autoRound !== T.round && seats[uid]){
    const s = seats[uid];
    if (!(s.ready && s.round===T.round)){
      autoRound = T.round;
      const amount = ls.get('lastBet', bet);
      const err = isBroke() ? 'Du bist pleite.' : canBet(amount);
      if (err){ auto = false; ls.set('autobet', false); toast('Auto-Einsatz gestoppt: ' + err); }
      else { const r = T.round; setTimeout(() => { if (auto && T?.phase==='betting' && T.round===r) placeBet(amount); }, 700); }
    }
  }
  const tk = T.turn && T.turn.u===uid && T.phase==='playing' ? `${tid}-${T.round}-${T.turn.h}` : null;
  if (tk && tk !== lastTurnKey) SFX.turn();
  lastTurnKey = tk;
  const r = T.phase==='done' ? T.history?.[T.round]?.[uid] : null;
  const dk = r ? `${tid}-${T.round}` : null;
  if (dk && dk !== lastDoneKey){
    const hs = T.hands[uid] || [];
    if (hs.some(H=>H.res==='bj')) SFX.bj(); else if (r.pay > r.bet) SFX.win();
    else if (hs.length && hs.every(H=>H.st==='bust')) SFX.bust(); else if (r.pay === r.bet) SFX.push(); else SFX.lose();
  }
  lastDoneKey = dk;
}

/* ---------- money: reconcile my balance with the table ---------- */
function applyResult(d, r, ctx){
  d.balance += r.pay;
  progress(d, 'bj', r.bet, r.pay, { n: r.n, w: r.w });
  const st = d.stats, net = r.pay - r.bet;
  st.hands += r.n; st.wins += r.w; st.losses += r.l; st.pushes += r.p; st.bj += r.bj;
  st.net += net; st.best = Math.max(st.best||0, net);
  d.week.net += net; d.week.hands += r.n; d.week.best = Math.max(d.week.best, net);
  d.hist = [...d.hist, { t:Date.now(), b:d.balance + d.euro, n:net, w:r.bet }].slice(-60);
  d.streaks.win = net > 0 ? d.streaks.win + 1 : net < 0 ? 0 : d.streaks.win;
  d.streaks.bj = r.bj > 0 ? d.streaks.bj + 1 : 0;
  if (r.w > 0) grant(d,'first_win');
  if (r.bj > 0) grant(d,'bj');
  if (d.streaks.bj >= 3) grant(d,'bj3');
  if (d.streaks.win >= 5) grant(d,'win5');
  if (st.hands >= 100) grant(d,'h100');
  if (st.hands >= 1000) grant(d,'h1000');
  if (r.insPay > 0) grant(d,'ins');
  if (ctx){
    const hs = ctx.hands || [];
    if (ctx.vip) grant(d,'vip');
    if (hs.some(H => H.res==='win' && H.c.length>=5 && score(H.c).t===21)) grant(d,'five21');
    if (hs.some(H => H.res==='win' && H.dbl)) grant(d,'dbl');
    if (hs.length>=2 && hs.every(H => H.res==='win')) grant(d,'split2');
    if (hs.some(H => H.bet >= 50000 && !H.dbl)) grant(d,'high');
  }
}
function reconcile(){
  if (!P || !T || !tid) return;
  withPlayer(d => { WHY = 'Blackjack';
    let changed = false;
    const key = tid+':'+T.round;
    const L = d.ledger;
    if (L && !L.settled && L.key !== key){
      const [lt, lr] = L.key.split(':');
      const h = lt===tid ? T.history?.[lr]?.[uid] : null;
      if (h) applyResult(d, h, null);
      else { d.stats.hands += 1; d.stats.losses += 1; d.stats.net -= L.committed; d.week.net -= L.committed; d.streaks.win = 0; d.streaks.bj = 0; progress(d, 'bj', L.committed, 0, { n: 1, w: 0 }); }
      d.ledger = { ...L, settled:true }; changed = true;
    }
    const mine = T.hands?.[uid];
    if (mine && T.phase!=='betting'){
      const committed = mine.reduce((s,h)=>s+h.bet, 0) + (T.ins?.[uid] || 0);
      if (!d.ledger || d.ledger.key !== key){ d.ledger = { key, committed:0, settled:false }; changed = true; }
      if (!d.ledger.settled && committed > d.ledger.committed){
        d.balance = Math.max(0, d.balance - (committed - d.ledger.committed)); d.ledger.committed = committed;
        d.lowMark = Math.min(d.lowMark, d.balance + d.euro); changed = true;
      }
      if (T.phase==='done' && !d.ledger.settled){
        const h = T.history?.[T.round]?.[uid];
        if (h){ applyResult(d, h, { hands: mine, vip: (T.min||0) >= VIP_MIN }); d.ledger.settled = true; changed = true; }
      }
    }
    return changed;
  });
}

/* ---------- dealer: one browser at the table runs it (lease) ---------- */
async function leaseLoop(){
  if (!tid || !uid){ amHost=false; return; }
  const ref = doc(fs,'locks',tid);
  try {
    amHost = await runTransaction(fs, async tx => {
      const s = await tx.get(ref); const d = s.exists() ? s.data() : {}; const now = Date.now();
      if (!d.holder || d.holder===uid || (d.exp||0) < now){
        if (d.holder===uid && (d.exp||0) - now > 8000) return true;
        tx.set(ref, { holder: uid, exp: now + 15000 }); return true;
      }
      return false;
    });
  } catch(e){ amHost = false; }
}
function presentSeat(u){ return !!seats[u] && isOnline(u) && (u===uid || players[u]?.table===tid); }
function reshuffle(nt){
  nt.shoe = newShoe(); const orig = nt.shoe.join('');
  nt.fair = { n: (nt.fair?.n || 0) + 1, orig, hash: sha256(orig), round: nt.round };
}
function draw(nt){ if (!nt.shoe.length) reshuffle(nt); return nt.shoe.pop(); }
function nextTurn(nt, fromU, fromH, now){
  const order = nt.order; let i = fromU ? order.indexOf(fromU) : 0;
  for (; i<order.length; i++){
    const u = order[i], hs = nt.hands[u];
    for (let h = (u===fromU ? fromH+1 : 0); h<hs.length; h++){
      const H = hs[h];
      if (H.st !== 'play') continue;
      if (H.c.length===1) H.c.push(draw(nt));
      if (score(H.c).t >= 21){ H.st = score(H.c).t>21 ? 'bust' : 'stand'; continue; }
      return { u, h, until: now + TURN_MS };
    }
  }
  return null;
}
function advance(nt, now){
  const t = nextTurn(nt, nt.turn?.u, nt.turn?.h ?? -1, now);
  if (t) nt.turn = t; else { nt.turn = null; nt.phase = 'dealer'; nt.dAt = now; }
}
function startPlay(nt, now){
  nt.phase = 'playing'; nt.turn = { u:null, h:-1 };
  const t = nextTurn(nt, null, -1, now);
  if (t) nt.turn = t; else { nt.turn=null; nt.phase='dealer'; nt.dAt=now; }
}
const dealDuration = n => reduceMotion ? 0 : (2*(n+1))*170 + 500;
function deal(nt, ready, now){
  if (nt.shoe.length < 80) reshuffle(nt);
  ready.sort((a,b)=>(a[1].joined||0)-(b[1].joined||0));
  nt.order = ready.map(r=>r[0]);
  nt.hands = {}; for (const [u,s] of ready) nt.hands[u] = [{ c:[], bet:s.bet, st:'play' }];
  nt.dealer = []; nt.ins = {}; nt.insDone = {};
  for (let k=0;k<2;k++){ for (const u of nt.order) nt.hands[u][0].c.push(draw(nt)); nt.dealer.push(draw(nt)); }
  for (const u of nt.order){ const H = nt.hands[u][0]; if (score(H.c).t===21) H.st='bj'; }
  nt.betUntil = null; nt.reveal = false; nt.turn = null;
  const wait = dealDuration(nt.order.length);
  if (nt.dealer[0][0]==='A'){ nt.phase='insurance'; nt.insUntil = now + wait + INS_MS; return; }
  if (cval(nt.dealer[0])===10 && score(nt.dealer).t===21){ nt.phase='dealer'; nt.dAt=now + wait; return; }
  startPlay(nt, now + wait);
}
function applyAct(nt, type, now){
  const { u, h } = nt.turn, hs = nt.hands[u], H = hs[h];
  if (type==='hit'){
    H.c.push(draw(nt)); const t = score(H.c).t;
    if (t>21) H.st='bust'; else if (t===21) H.st='stand';
    if (H.st!=='play') advance(nt, now); else nt.turn.until = now + TURN_MS;
  } else if (type==='stand'){
    H.st='stand'; advance(nt, now);
  } else if (type==='surrender'){
    if (H.c.length!==2 || hs.length!==1 || H.sp) return;
    H.st='surr'; advance(nt, now);
  } else if (type==='double'){
    if (H.c.length!==2 || H.sa) return;
    H.bet *= 2; H.dbl = true; H.c.push(draw(nt));
    H.st = score(H.c).t>21 ? 'bust' : 'stand'; advance(nt, now);
  } else if (type==='split'){
    if (H.c.length!==2 || H.sa || hs.length>=4 || cval(H.c[0])!==cval(H.c[1])) return;
    const aces = H.c[0][0]==='A';
    const H2 = { c:[H.c.pop()], bet:H.bet, st:'play', sp:true };
    H.sp = true; hs.splice(h+1, 0, H2);
    H.c.push(draw(nt));
    if (aces){ H2.c.push(draw(nt)); H.st = H2.st = 'stand'; H.sa = H2.sa = true; advance(nt, now); }
    else if (score(H.c).t===21){ H.st='stand'; advance(nt, now); }
    else nt.turn.until = now + TURN_MS;
  }
}
function settle(nt){
  const d = score(nt.dealer).t, dBJ = nt.dealer.length===2 && d===21;
  const hist = {};
  for (const u of nt.order){
    const r = { pay:0, bet:0, n:0, w:0, l:0, p:0, bj:0, insPay:0 };
    for (const H of nt.hands[u]){
      const s = score(H.c).t, nat = H.st==='bj';
      if (H.st==='surr'){ H.res='surr'; H.pay=Math.floor(H.bet/2); }
      else if (H.st==='bust'){ H.res='lose'; H.pay=0; }
      else if (nat && !dBJ){ H.res='bj'; H.pay=Math.floor(H.bet*2.5); }
      else if (dBJ){ H.res = nat?'push':'lose'; H.pay = nat?H.bet:0; }
      else if (d>21 || s>d){ H.res='win'; H.pay=H.bet*2; }
      else if (s===d){ H.res='push'; H.pay=H.bet; }
      else { H.res='lose'; H.pay=0; }
      r.pay += H.pay; r.bet += H.bet; r.n++;
      if (H.res==='win') r.w++; else if (H.res==='bj'){ r.w++; r.bj++; } else if (H.res==='push') r.p++; else r.l++;
    }
    const ins = nt.ins?.[u] || 0;
    if (ins){ r.bet += ins; r.insPay = dBJ ? ins*3 : 0; r.pay += r.insPay; }
    hist[u] = r;
  }
  nt.history = nt.history || {};
  nt.history[nt.round] = hist;
  for (const k of Object.keys(nt.history)) if (+k < nt.round - 8) delete nt.history[k];
}
function step(nt, now){
  const seatList = Object.entries(seats);
  const min = nt.min || MIN_BET;
  nt.acts = nt.acts || {};
  switch (nt.phase){
    case 'betting': {
      const present = seatList.filter(([u]) => presentSeat(u));
      const ready = present.filter(([,s]) => s.ready && s.round===nt.round && s.bet>=min && s.bet<=MAX_BET);
      if (!ready.length){ if (nt.betUntil){ nt.betUntil=null; return true; } return false; }
      if (!nt.betUntil){ nt.betUntil = now + BET_MS; if (ready.length < present.length) return true; }
      if (ready.length === present.length || now >= nt.betUntil){ deal(nt, ready, now); return true; }
      return false;
    }
    case 'insurance': {
      let changed = false;
      for (const u of nt.order){
        const s = seats[u];
        if (s?.act && s.act.round===nt.round && s.act.seq > (nt.acts[u]||0) && (s.act.type==='insure' || s.act.type==='noinsure')){
          nt.acts[u] = s.act.seq; nt.insDone[u] = true;
          if (s.act.type==='insure') nt.ins[u] = Math.floor(nt.hands[u][0].bet/2);
          changed = true;
        }
      }
      const all = nt.order.every(u => nt.insDone[u] || !seats[u]);
      if (all || now >= nt.insUntil){
        if (score(nt.dealer).t===21){ nt.phase='dealer'; nt.dAt=now; }
        else startPlay(nt, now);
        return true;
      }
      return changed;
    }
    case 'playing': {
      const t = nt.turn; if (!t){ nt.phase='dealer'; nt.dAt=now; return true; }
      const s = seats[t.u];
      if (s && s.act && s.act.round===nt.round && s.act.seq > (nt.acts[t.u]||0)){
        nt.acts[t.u] = s.act.seq;
        if (s.act.h === t.h) applyAct(nt, s.act.type, now);
        return true;
      }
      if (now > t.until || !seats[t.u]){ nt.hands[t.u][t.h].st='stand'; advance(nt, now); return true; }
      return false;
    }
    case 'dealer': {
      if (now - (nt.dAt||0) < 800) return false;
      if (!nt.reveal){ nt.reveal = true; nt.dAt = now; return true; }
      const live = nt.order.some(u => nt.hands[u].some(H => H.st==='stand'));
      if (live && score(nt.dealer).t < 17){ nt.dealer.push(draw(nt)); nt.dAt = now; return true; }
      settle(nt); nt.phase='done'; nt.doneAt=now; return true;
    }
    case 'done': {
      if (now - (nt.doneAt||0) < DONE_MS) return false;
      nt.phase='betting'; nt.round += 1; nt.hands={}; nt.dealer=[]; nt.order=[]; nt.turn=null; nt.reveal=false; nt.betUntil=null; nt.ins={}; nt.insDone={};
      return true;
    }
  }
  return false;
}
async function hostTick(){
  if (!amHost || hostBusy || !T || !tid) return;
  hostBusy = true;
  try {
    const nt = structuredClone(T);
    let changed = false;
    if (!nt.fair && nt.phase==='betting'){ reshuffle(nt); changed = true; }
    if (step(nt, Date.now())) changed = true;
    if (changed){
      T = nt; reconcile(); afterTable(); renderAll();
      await setDoc(doc(fs,'tables',tid), nt);
    }
  } catch(e){ console.warn(e); }
  finally { hostBusy = false; }
}

/* ---------- card animation: cards fly out of the shoe and flip ---------- */
const anim = { seen: new Map(), prime: false };
const FLY_MS = 520, FLIP_MS = 420, STAGGER = 170;
function cardHTML(c, key, down, ord){
  const r = c[0]==='T' ? '10' : c[0], s = SUIT[c[1]], red = c[1]==='H'||c[1]==='D';
  return `<div class="c${red?' red':''}${down?' down':''}" data-k="${key}" data-o="${ord ?? 999}" aria-label="${down?'verdeckte Karte':r+s}">
    <div class="ci"><div class="cf">${down?'':`<span class="r">${r}</span><span class="s">${s}</span><span class="big">${s}</span>`}</div><div class="cb"></div></div></div>`;
}
function animateCards(root){
  const els = [...root.querySelectorAll('.c[data-k]')];
  const now = performance.now();
  const shoe = root.querySelector('.shoe');
  if (anim.prime && T){ for (const el of els) anim.seen.set(el.dataset.k, { t0:-1e9, delay:0, down: el.classList.contains('down') }); anim.prime = false; return; }
  const fresh = els.filter(el => !anim.seen.has(el.dataset.k)).sort((a,b)=>(+a.dataset.o)-(+b.dataset.o));
  fresh.forEach((el,i) => { anim.seen.set(el.dataset.k, { t0: now, delay: i*STAGGER, down: el.classList.contains('down'), fresh:true }); SFX.card((i*STAGGER + FLY_MS*.75)/1000); });
  if (reduceMotion) return;
  const sr = shoe?.getBoundingClientRect();
  for (const el of els){
    const a = anim.seen.get(el.dataset.k);
    const down = el.classList.contains('down');
    const elapsed = now - a.t0;
    if (a.fresh && elapsed < a.delay + FLY_MS + FLIP_MS){
      const r = el.getBoundingClientRect();
      const dx = sr ? (sr.left + sr.width/2) - (r.left + r.width/2) : 0, dy = sr ? (sr.top + sr.height/2) - (r.top + r.height/2) : -60;
      const fly = el.animate([
        { transform:`translate(${dx}px,${dy}px) rotate(-28deg) scale(.82)` },
        { transform:'translate(0,0) rotate(0) scale(1)' }
      ], { duration: FLY_MS, delay: a.delay, easing:'cubic-bezier(.18,.82,.26,1)', fill:'backwards' });
      fly.currentTime = elapsed;
      if (!down){
        const flip = el.firstElementChild.animate([
          { transform:'rotateY(180deg)' }, { transform:'rotateY(180deg)', offset:.5 }, { transform:'rotateY(0deg)' }
        ], { duration: FLY_MS + FLIP_MS*.6, delay: a.delay, easing:'ease-out', fill:'backwards' });
        flip.currentTime = elapsed;
      }
    }
    if (a.down && !down && !a.flipT0){ a.flipT0 = now; SFX.card(); }
    a.down = down;
    if (a.flipT0 && now - a.flipT0 < FLIP_MS + 60){
      const f = el.firstElementChild.animate([{ transform:'rotateY(180deg) scale(1.08)' }, { transform:'rotateY(0deg) scale(1)' }], { duration: FLIP_MS, easing:'ease-out' });
      f.currentTime = now - a.flipT0;
    }
  }
  if (anim.seen.size > 400){ const keep = new Set(els.map(e=>e.dataset.k)); for (const k of anim.seen.keys()) if (!keep.has(k)) anim.seen.delete(k); }
}

/** book a finished bet in the stats (balance is handled by the caller) */
function record(d, key, stake, pay){
  const net = pay - stake;
  d.games ||= {};
  const g = d.games[key] ||= { n:0, net:0, best:0 };
  g.n++; g.net += net; g.best = Math.max(g.best, net);
  d.stats.net += net; d.stats.best = Math.max(d.stats.best||0, net);
  d.week.net += net; d.week.best = Math.max(d.week.best, net);
  d.hist = [...d.hist, { t:Date.now(), b:d.balance + d.euro, n:net, w:stake, g:key }].slice(-60);
  d.lowMark = Math.min(d.lowMark, d.balance + d.euro);
  progress(d, key, stake, pay);
}
function betError(amount, min=50, max=MAX_BET){
  const lim = limitState();
  if (lim?.hit) return lim.hit==='win' ? 'Gewinnziel erreicht. Starte im Konto eine neue Session.' : 'Stop-Loss erreicht. Starte im Konto eine neue Session.';
  if (!(amount >= min)) return `Mindesteinsatz: ${fmt(min)} Legats.`;
  if (amount > max) return `Höchsteinsatz: ${fmt(max)} Legats.`;
  if (amount > P.balance) return P.euro > 0 ? 'Nicht genug Legats. Heb auf der Bank etwas ab.' : 'Nicht genug Legats.';
  return null;
}
/** one instant game round: take the stake, pay out, book it. The win shows after the animation (hold). */
function playInstant(key, stake, pay, extra){
  const ok = withPlayer(d => { WHY = GAME_NAMES[key] || key;
    if (d.balance < stake) return false;
    d.balance += pay - stake; record(d, key, stake, pay); extra?.(d);

  if (ok) hold = pay;

}

let wheelRot = 0, wheelBusy = false, wheelMsg = '';
function wheelState(){
  const D = P?.daily || {}, today = dayId();
  const streak = D.last === dayId(Date.now()-864e5) ? (D.streak||0) + 1 : 1;
  return { ready: D.last !== today, streak };
}
function wheelSVG(size=300, main=false){
  const n = WHEEL.length, r = 140, cx = 150, cy = 150;
  const sl = WHEEL.map((s,i) => {
    const a0 = (i/n)*2*Math.PI - Math.PI/2 - Math.PI/n, a1 = a0 + 2*Math.PI/n, am = (a0+a1)/2;
    const p = a => `${(cx + r*Math.cos(a)).toFixed(2)},${(cy + r*Math.sin(a)).toFixed(2)}`;
    const tx = cx + r*0.68*Math.cos(am), ty = cy + r*0.68*Math.sin(am), rot = am*180/Math.PI + 90;
    return `<path d="M${cx},${cy} L${p(a0)} A${r},${r} 0 0 1 ${p(a1)} Z" fill="${WHEEL_COL[i]}" stroke="#f2ebdd" stroke-width="2"/>
